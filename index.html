 time:L("~45 min","~45 min","~45 min"), diff:L("Easy–Medium","Fácil–Media","Facile–Moyenne"),
 space:L("About 2 × 1 m of clear floor (build it lying down)","Unos 2 × 1 m de piso libre (se arma acostado)","Environ 2 × 1 m de sol libre (montage à plat)"), people:"2",
 parts:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Fixed shelf","Repisa fija","Étagère fixe"),"×2"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×3"],[L("Back panel (folding)","Panel trasero (plegable)","Panneau arrière (pliant)"),"×1"],[L("Base/kick plate","Zócalo","Plinthe"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×8"],[L("Screw","Tornillo","Vis"),"×10"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×12"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×16"],[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]],
 tools:L("Phillips screwdriver, hammer, and a drill for anchoring. Two people — it is tall for its price.","Destornillador Phillips, martillo y taladro para el anclaje. Dos personas — es alto para su precio.","Tournevis Phillips, marteau et perceuse pour l'ancrage. Deux personnes — elle est haute pour son prix."),
 surface:L("Build it lying face-down and walk it upright only once the back is nailed on. Never load the shelves before anchoring.","Ármalo acostado boca abajo y páralo solo cuando el panel trasero esté clavado. Nunca cargues las repisas antes de anclar.","Montez-la à plat face vers le bas et redressez-la seulement une fois le panneau arrière cloué. Ne chargez jamais les étagères avant l'ancrage."),
 steps:[
  {svg:"unpack", title:L("Unpack and lay it out flat","Desempaca y acomoda acostado","Déballez et disposez à plat"),
   text:L("Lay the two tall side panels parallel with the top, the two fixed shelves and the base between them. Unfold the back panel nearby so it relaxes flat while you work.","Pon los dos paneles laterales largos en paralelo con el superior, las dos repisas fijas y la base entre ellos. Despliega el panel trasero cerca para que se aplane mientras trabajas.","Posez les deux longs panneaux latéraux parallèles avec le supérieur, les deux étagères fixes et la base entre eux. Dépliez le panneau arrière à proximité pour qu'il s'aplatisse pendant le travail."),
   need:[[L("All panels + hardware","Todos los paneles + tornillería","Tous les panneaux + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the top panel and the fixed shelves. Seat cam locks in the side panels with arrows facing the dowel holes.","Atornilla los pernos en el panel superior y las repisas fijas. Asienta las levas en los laterales con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans le panneau supérieur et les étagères fixes. Placez les cames dans les panneaux latéraux, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:2, title:L("Join the frame lying down","Une el marco acostado","Joignez le cadre à plat"),
   text:L("Connect the top, both fixed shelves and the base between the side panels, turning each cam lock as you go. Keep the frame flat — a twisted frame never squares up later.","Une el panel superior, ambas repisas fijas y la base entre los laterales, girando cada leva al avanzar. Mantén el marco plano — un marco torcido nunca se cuadra después.","Reliez le panneau supérieur, les deux étagères fixes et la base entre les panneaux latéraux, en tournant chaque came. Gardez le cadre à plat — un cadre tordu ne se redresse jamais ensuite."),
   need:[[L("Fixed shelf","Repisa fija","Étagère fixe"),"×2"],[L("Top panel + base","Panel superior + base","Panneau supérieur + base"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Nail the folding back panel","Clava el panel trasero plegable","Clouez le panneau arrière pliant"),
   text:L("Spread the unfolded back panel over the frame, align the edges, and nail the perimeter every few inches. Check the diagonals as you go — the back panel locks in the square.","Extiende el panel trasero desplegado sobre el marco, alinea los bordes y clava el perímetro cada pocos centímetros. Revisa las diagonales al avanzar — el panel trasero fija la escuadra.","Étalez le panneau arrière déplié sur le cadre, alignez les bords et clouez le périmètre tous les quelques centimètres. Vérifiez les diagonales en avançant — le panneau arrière verrouille l'équerrage."),
   need:[[L("Back panel (folding)","Panel trasero (plegable)","Panneau arrière (pliant)"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×16"]], tool:L("Hammer","Martillo","Marteau"),
   tip:L("Start nailing at one corner and work around — nailing opposite corners first can trap a wrinkle in the middle.","Empieza a clavar en una esquina y avanza en círculo — clavar esquinas opuestas primero puede atrapar una arruga al centro.","Commencez à clouer dans un coin et progressez en rond — clouer les coins opposés d'abord peut piéger un pli au centre.")},
  {svg:"shelf", title:L("Stand it up, add shelves","Páralo y agrega las repisas","Redressez et ajoutez les étagères"),
   text:L("With two people, walk the bookcase upright against its wall. Push four pins per height — count holes from the top on both sides — and rest the three adjustable shelves on them.","Entre dos, paren el librero contra su pared. Mete cuatro pernos por altura — cuenten los agujeros desde arriba en ambos lados — y apoyen las tres repisas ajustables sobre ellos.","À deux, redressez la bibliothèque contre son mur. Enfoncez quatre taquets par hauteur — comptez les trous depuis le haut des deux côtés — et posez les trois étagères réglables dessus."),
   need:[[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×3"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×12"]]},
  {svg:"anchor", title:L("Anchor to the wall","Anclaje a la pared","Ancrez au mur"),
   text:L("Fix the anchor strap to the top back of the bookcase and into a wall stud. Tall and narrow means tippy when loaded — this strap is not optional.","Fija la correa de anclaje a la parte trasera superior del librero y a un montante de la pared. Alto y angosto significa inestable cuando se carga — esta correa no es opcional.","Fixez la sangle d'ancrage en haut à l'arrière de la bibliothèque et dans un montant du mur. Haute et étroite signifie instable une fois chargée — cette sangle n'est pas optionnelle."),
   need:[[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"level", title:L("Level and load check","Nivelación y prueba de carga","Niveau et test de charge"),
   text:L("Check for plumb, load the heaviest books on the fixed shelves, and spread weight evenly left to right. Re-tighten the base screws to finish.","Verifica el plomo, carga los libros más pesados en las repisas fijas y reparte el peso parejo de izquierda a derecha. Reaprieta los tornillos de la base para terminar.","Vérifiez l'aplomb, chargez les livres les plus lourds sur les étagères fixes et répartissez le poids uniformément de gauche à droite. Resserrez les vis de la base pour finir."),
   need:[[L("Screw","Tornillo","Vis"),"×10"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
 ]},
/* ---------- Sauder demo pack · Sauder County Line TV Stand ---------- */
{ id:"sau413773", store:"Walmart", alsoAt:["Amazon","Wayfair"], sku:"413773", anchor:true, brand:"Sauder",
 name:L("Sauder County Line TV Stand","Mueble para TV Sauder County Line","Meuble TV Sauder County Line"),
 blurb:L("TV stand for screens up to 60 in. with two framed doors, adjustable center shelves and cable cutouts in the back.","Mueble para TV de hasta 60 pulg. con dos puertas enmarcadas, repisas centrales ajustables y salidas para cables en la parte trasera.","Meuble TV pour écrans jusqu'à 60 po avec deux portes encadrées, étagères centrales réglables et passages de câbles à l'arrière."),
 time:L("~65 min","~65 min","~65 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 2 × 1.5 m of clear floor","Unos 2 × 1.5 m de piso libre","Environ 2 × 1,5 m de sol libre"), people:"2",
 parts:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Bottom panel","Panel inferior","Panneau inférieur"),"×1"],[L("Center divider","Divisor central","Séparateur central"),"×2"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×2"],[L("Back panel (with cable cutouts)","Panel trasero (con salidas de cables)","Panneau arrière (avec passages de câbles)"),"×1"],[L("Framed door","Puerta enmarcada","Porte encadrée"),"×2"],[L("Base rail","Riel de base","Rail de base"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×12"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×22"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×8"],[L("Door hinge","Bisagra","Charnière"),"×4"],[L("Door knob + bolt","Perilla + perno","Bouton de porte + boulon"),"×2"],[L("TV anti-tip strap","Correa antivuelco para TV","Sangle anti-basculement TV"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×14"]],
 tools:L("Phillips screwdriver, hammer, and a drill if you anchor the TV strap to a stud.","Destornillador Phillips, martillo y taladro si anclas la correa de la TV a un montante.","Tournevis Phillips, marteau et perceuse si vous ancrez la sangle TV à un montant."),
 surface:L("Build the stand face-down on a blanket. Route every cable through the back cutouts before the TV goes on — reaching behind a loaded stand is nobody's favorite job.","Arma el mueble boca abajo sobre una cobija. Pasa todos los cables por las salidas traseras antes de poner la TV — meter la mano detrás de un mueble cargado no es el trabajo favorito de nadie.","Montez le meuble face vers le bas sur une couverture. Passez tous les câbles par les passages arrière avant de poser le téléviseur — atteindre derrière un meuble chargé n'est le travail préféré de personne."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort","Desempaca y ordena","Déballez et triez"),
   text:L("Lay out the top, bottom, sides, dividers, base rail and back panel. Keep the two framed doors wrapped until the body is built — their fronts scratch easily.","Acomoda el panel superior, el inferior, los laterales, los divisores, el riel de base y el panel trasero. Deja las dos puertas envueltas hasta que el cuerpo esté armado — sus frentes se rayan fácil.","Disposez le panneau supérieur, l'inférieur, les côtés, les séparateurs, le rail de base et le panneau arrière. Gardez les deux portes emballées jusqu'à ce que le corps soit monté — leurs faces se rayent facilement."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the top, bottom and base rail. Seat cam locks in the side panels and dividers, arrows facing the dowel holes.","Atornilla los pernos en el panel superior, el inferior y el riel de base. Asienta las levas en los laterales y divisores, con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans le panneau supérieur, l'inférieur et le rail de base. Placez les cames dans les panneaux latéraux et les séparateurs, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×12"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:1, title:L("Build the stand body","Arma el cuerpo del mueble","Assemblez le corps du meuble"),
   text:L("Join the bottom and base rail between the side panels, stand in the two center dividers, then lower the top panel on and lock every cam. Wide furniture racks easily — keep it flat on the floor.","Une el panel inferior y el riel de base entre los laterales, para los dos divisores centrales y luego baja el panel superior y bloquea cada leva. Los muebles anchos se descuadran fácil — mantenlo plano en el piso.","Joignez le panneau inférieur et le rail de base entre les côtés, placez les deux séparateurs centraux, puis abaissez le panneau supérieur et verrouillez chaque came. Les meubles larges se déforment facilement — gardez-le à plat au sol."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Center divider","Divisor central","Séparateur central"),"×2"],[L("Top + bottom + base rail","Superior + inferior + riel de base","Supérieur + inférieur + rail de base"),"×3"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Nail on the back panel","Clava el panel trasero","Clouez le panneau arrière"),
   text:L("Center the back panel with its cable cutouts behind the center openings and nail the perimeter. Thread your power strip cord through a cutout now, while the stand is still face-down.","Centra el panel trasero con sus salidas de cables detrás de los huecos centrales y clava el perímetro. Pasa el cable de tu regleta por una salida ahora, con el mueble aún boca abajo.","Centrez le panneau arrière avec ses passages de câbles derrière les ouvertures centrales et clouez le périmètre. Passez le cordon de votre multiprise par un passage maintenant, le meuble encore face vers le bas."),
   need:[[L("Back panel (with cable cutouts)","Panel trasero (con salidas de cables)","Panneau arrière (avec passages de câbles)"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×14"]], tool:L("Hammer","Martillo","Marteau")},
  {svg:"shelf", title:L("Set the adjustable shelves","Coloca las repisas ajustables","Posez les étagères réglables"),
   text:L("Turn the stand upright with two people. Push four pins per shelf at matched heights in the center section and rest the two adjustable shelves on them, sized to your tallest component.","Paren el mueble entre dos. Mete cuatro pernos por repisa a alturas parejas en la sección central y apoya las dos repisas ajustables, con espacio para tu componente más alto.","Redressez le meuble à deux. Enfoncez quatre taquets par étagère à hauteurs assorties dans la section centrale et posez les deux étagères réglables, en laissant la place à votre appareil le plus haut."),
   need:[[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×2"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×8"]],
   tip:L("Game consoles and cable boxes need air — leave a shelf gap above anything with a fan.","Las consolas y los decodificadores necesitan aire — deja un espacio de repisa sobre todo lo que tenga ventilador.","Les consoles et décodeurs ont besoin d'air — laissez un espace au-dessus de tout appareil avec ventilateur.")},
  {svg:"panels", title:L("Hang the framed doors","Cuelga las puertas enmarcadas","Accrochez les portes encadrées"),
   text:L("Screw the hinges to the doors, then to the side panels. Adjust until both doors sit level with an even center gap, and add the knobs.","Atornilla las bisagras a las puertas y luego a los paneles laterales. Ajusta hasta que ambas puertas queden niveladas con un espacio central parejo, y coloca las perillas.","Vissez les charnières aux portes, puis aux panneaux latéraux. Réglez jusqu'à ce que les deux portes soient de niveau avec un écart central régulier, et posez les boutons."),
   need:[[L("Framed door","Puerta enmarcada","Porte encadrée"),"×2"],[L("Door hinge","Bisagra","Charnière"),"×4"],[L("Door knob + bolt","Perilla + perno","Bouton de porte + boulon"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"anchor", title:L("Strap the TV against tipping","Asegura la TV contra vuelcos","Fixez le téléviseur contre le basculement"),
   text:L("Set the TV centered on the stand, then fix the anti-tip strap from the TV's back (or the stand's top back edge) into a wall stud. Big screens on stands are a known tip risk with kids and pets.","Coloca la TV centrada en el mueble y luego fija la correa antivuelco desde la parte trasera de la TV (o el borde trasero superior del mueble) a un montante de la pared. Las pantallas grandes en muebles son un riesgo conocido de vuelco con niños y mascotas.","Placez le téléviseur centré sur le meuble, puis fixez la sangle anti-basculement de l'arrière du téléviseur (ou du bord arrière supérieur du meuble) dans un montant du mur. Les grands écrans sur meubles sont un risque de basculement connu avec enfants et animaux."),
   need:[[L("TV anti-tip strap","Correa antivuelco para TV","Sangle anti-basculement TV"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"tighten", title:L("Cables tidy, final check","Cables ordenados y revisión final","Câbles rangés et contrôle final"),
   text:L("Bundle loose cables with ties through the cutouts, re-check every cam lock, and press the stand's corners to confirm it sits flat. Movie night is cleared for takeoff.","Amarra los cables sueltos con cinchos por las salidas, revisa cada leva y presiona las esquinas del mueble para confirmar que asienta plano. La noche de cine tiene luz verde.","Attachez les câbles libres avec des liens par les passages, revérifiez chaque came et pressez les coins du meuble pour confirmer qu'il est bien plat. La soirée cinéma est autorisée au décollage."),
   need:[[L("Wood screw","Tornillo para madera","Vis à bois"),"×22"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
 ]},

{ id:"sau408559", store:"Amazon", alsoAt:["Walmart","Wayfair"], sku:"408559", anchor:false, brand:"Sauder",
 name:L("Sauder Edge Water Computer Desk","Escritorio para computadora Sauder Edge Water","Bureau d'ordinateur Sauder Edge Water"),
 blurb:L("Desk with a file drawer, two storage drawers and a flip-down keyboard tray front — Edge Water's clean-lined workhorse.","Escritorio con cajón archivero, dos cajones de almacenamiento y frente abatible para teclado — el caballo de batalla de líneas limpias de Edge Water.","Bureau avec tiroir classeur, deux tiroirs de rangement et façade clavier abattante — le cheval de travail aux lignes épurées d'Edge Water."),
 time:L("~70 min","~70 min","~70 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 2 × 1.5 m of clear floor","Unos 2 × 1.5 m de piso libre","Environ 2 × 1,5 m de sol libre"), people:"1–2",
 parts:[[L("Desktop","Cubierta","Plateau"),"×1"],[L("Pedestal side","Lateral de pedestal","Côté de caisson"),"×4"],[L("Pedestal back","Trasera de pedestal","Dos de caisson"),"×2"],[L("Modesty panel","Panel de modestia","Panneau de fond"),"×1"],[L("Drawer front","Frente de cajón","Façade de tiroir"),"×3"],[L("Drawer side","Costado de cajón","Côté de tiroir"),"×6"],[L("Drawer back","Trasera de cajón","Dos de tiroir"),"×3"],[L("Drawer bottom","Fondo de cajón","Fond de tiroir"),"×3"],[L("Keyboard tray front (flip-down)","Frente de bandeja abatible","Façade clavier abattante"),"×1"],[L("Keyboard tray","Bandeja para teclado","Tablette clavier"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×26"],[L("Drawer glide set","Juego de correderas","Jeu de glissières"),"×3"],[L("Drawer pull + bolts","Jaladera + pernos","Poignée + boulons"),"×3"],[L("Hanging file bar","Barra para carpetas","Barre pour dossiers"),"×2"],[L("Tray hinge","Bisagra de bandeja","Charnière de tablette"),"×2"]],
 tools:L("Phillips screwdriver and a hammer. A second person helps flip the desk upright.","Destornillador Phillips y un martillo. Una segunda persona ayuda a voltear el escritorio.","Tournevis Phillips et un marteau. Une deuxième personne aide à redresser le bureau."),
 surface:L("Build the pedestals flat on a blanket and join them to the desktop face-down. The flip-down tray front is finished on one side only — keep track of which side faces out.","Arma los pedestales acostados sobre una cobija y únelos a la cubierta boca abajo. El frente abatible de la bandeja tiene acabado de un solo lado — ten claro qué lado va hacia afuera.","Montez les caissons à plat sur une couverture et joignez-les au plateau face vers le bas. La façade abattante de la tablette n'est finie que d'un côté — notez quel côté va vers l'extérieur."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort","Desempaca y ordena","Déballez et triez"),
   text:L("Sort into: desktop, two pedestals, three drawer sets, and the keyboard tray parts. The file drawer set is the deep one — mark it so it does not get mixed up.","Ordena en: cubierta, dos pedestales, tres juegos de cajón y las piezas de la bandeja del teclado. El juego del cajón archivero es el profundo — márcalo para que no se confunda.","Triez en : plateau, deux caissons, trois jeux de tiroirs et les pièces de la tablette clavier. Le jeu du tiroir classeur est le profond — marquez-le pour ne pas le confondre."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the desktop underside and the pedestal sides. Seat cam locks with arrows facing the dowel holes.","Atornilla los pernos bajo la cubierta y en los laterales de los pedestales. Asienta las levas con las flechas hacia los agujeros de los pernos.","Vissez les goujons sous le plateau et sur les côtés des caissons. Placez les cames, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"panels", title:L("Build the two pedestals","Arma los dos pedestales","Montez les deux caissons"),
   text:L("Join each pedestal's sides to its back panel, locking the cams. One pedestal carries three drawers, the other leaves knee space under the tray — check which is which before joining them to the top.","Une los laterales de cada pedestal a su panel trasero, bloqueando las levas. Un pedestal lleva tres cajones y el otro deja el espacio para las rodillas bajo la bandeja — verifica cuál es cuál antes de unirlos a la cubierta.","Joignez les côtés de chaque caisson à son panneau arrière, en verrouillant les cames. Un caisson porte trois tiroirs, l'autre laisse l'espace des genoux sous la tablette — vérifiez lequel est lequel avant de les joindre au plateau."),
   need:[[L("Pedestal side","Lateral de pedestal","Côté de caisson"),"×4"],[L("Pedestal back","Trasera de pedestal","Dos de caisson"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Join to the desktop, add modesty panel","Une a la cubierta y pon el panel","Joignez au plateau, posez le panneau de fond"),
   text:L("With the desktop face-down, set the pedestals onto their dowels and lock all cams. Slide the modesty panel into its grooves between the pedestals and confirm square by the diagonals.","Con la cubierta boca abajo, coloca los pedestales sobre sus pernos y bloquea todas las levas. Desliza el panel de modestia en sus ranuras entre los pedestales y confirma la escuadra con las diagonales.","Plateau face vers le bas, posez les caissons sur leurs goujons et verrouillez toutes les cames. Glissez le panneau de fond dans ses rainures entre les caissons et confirmez l'équerrage par les diagonales."),
   need:[[L("Desktop","Cubierta","Plateau"),"×1"],[L("Modesty panel","Panel de modestia","Panneau de fond"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Mount the drawer glides","Monta las correderas","Montez les glissières"),
   text:L("Flip the desk upright with help. Separate the three glide sets and screw the cabinet halves inside the drawer pedestal at the three heights, level and matched.","Voltea el escritorio con ayuda. Separa los tres juegos de correderas y atornilla las mitades del mueble dentro del pedestal de cajones a las tres alturas, niveladas y parejas.","Redressez le bureau à deux. Séparez les trois jeux de glissières et vissez les moitiés côté meuble dans le caisson à tiroirs aux trois hauteurs, de niveau et assorties."),

/* ================= STEP VIDEOS (v1.1) =================
   Manifest pattern: to video-cover another guide, generate the
   clips, drop the files in ./videos/ and add one entry here:
   productId -> { stepIndex (0-based) -> file name }.
   Steps without an entry fall back to the animated schematic.
   The Latitude Run daybed (latg2027) is fully covered: 6 clips
   for its 7 steps (one clip demos steps 2+3, rails + fastening).
   Host clips: Max & Max Girl (steps 1), Max (steps 2-3),
   Max Girl (step 7); furniture-only clips: steps 4, 5, 6. */
const VIDEO_DIR = "videos/";
const STEP_VIDEOS = {
  latg2027: {0:"latg2027-step1-hosts-unpack.mp4",
             1:"latg2027-step2-max-rails.mp4",
             2:"latg2027-step2-max-rails.mp4",
             3:"latg2027-step4-headboard.mp4",
             4:"latg2027-step5-trundle.mp4",
             5:"latg2027-step6-slats.mp4",
             6:"latg2027-step7-maxgirl-wheels.mp4"}
};
function stepVideo(pid, idx){ const m = STEP_VIDEOS[pid]; return (m && m[idx]) ? VIDEO_DIR + m[idx] : null; }

/* ================= APP LOGIC ================= */

const SCREENS = ["screen-home","screen-product","screen-guide","screen-done"];

const li = arr => arr.map(x=>`<li><span>${x[0][S.lang]}</span><span class="qty">${x[1]}</span></li>`).join("");

/* ---------- brand / PWA ---------- */
function applyBrand(){
  document.title = BRAND.name;
  $("brand-name").textContent = BRAND.name;
  $("version-tag").textContent = BRAND.version;
  try{
    const man = {name:BRAND.name, short_name:BRAND.name, start_url:".", display:"standalone",
      background_color:"#f4f6fb", theme_color:"#1558d6", icons:[]};
    const link = document.createElement("link"); link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){}
}

function setLang(l){ stopSpeak(); S.lang = l; save(); renderChrome(); }
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* ---------- home ---------- */
function renderStores(){
  const box=$("stores"); box.innerHTML="";
  const mk=(val,label)=>{const c=document.createElement("button");c.className="chip"+(storeF===val?" on":"");
    c.textContent=label;c.onclick=()=>{storeF=val;renderStores();renderResults();};box.appendChild(c);};
  mk("all",t("allStores"));
  [...new Set(PRODUCTS.flatMap(p=>[p.store].concat(p.alsoAt||[])))].forEach(s=>mk(s,s));
  mk("fav",t("favorites"));
}
function match(p,q){
  if(!q) return true; q=q.toLowerCase();
  const hay=[p.sku,p.store,p.brand||""].concat(p.alsoAt||[],[p.name.en,p.name.es,p.name.fr]).join(" ").toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
/* ---------- shared product card + brand spotlight ---------- */
function makeCard(p){
  const prog = S.prog[p.id];
  let badge = `<span class="badge">${p.store}</span>`;
  if(prog && prog.done) badge += ` <span class="badge done">${t("completed")}</span>`;
  else if(prog && prog.step>0) badge += ` <span class="badge prog">${t("inProgress")(prog.step+1)} / ${p.steps.length}</span>`;
  const d=document.createElement("div");d.className="card prod";
  d.innerHTML=`<button class="favbtn" aria-label="favorite">${isFav(p.id)?"♥":"♡"}</button>${badge}<h3>${p.name[S.lang]}</h3>
    <div class="meta"><span>📦 ${t("sku")}: ${p.sku}</span><span>⏱ ${p.time[S.lang]}</span><span>🧩 ${p.steps.length} ${t("stepsLbl")}</span></div>
    <p style="font-size:13px;color:var(--muted);margin:8px 0 0;">${p.blurb[S.lang]}</p>
    ${p.alsoAt&&p.alsoAt.length?`<p class="alsoat">🏪 ${t("alsoAt")}: ${p.alsoAt.join(", ")}</p>`:""}`;
  d.querySelector(".favbtn").onclick=e=>{e.stopPropagation();toggleFav(p.id);};
  d.onclick=()=>{cur=p;renderProduct(p);show("screen-product");window.scrollTo(0,0);};
  return d;
}
const isSauder = p => p.brand==="Sauder" || /^Sauder\b/.test(p.name.en);
function renderSpotlight(){
  const box=$("spotlight-results"); if(!box) return;
  const list=PRODUCTS.filter(isSauder);
  $("t-spotlight-title").textContent=t("spotlightTitle");
  $("t-spotlight-sub").textContent=t("spotlightSub")(list.length);
  $("t-spotlight-note").textContent=t("spotlightNote");
  box.innerHTML="";
  list.forEach(p=>box.appendChild(makeCard(p)));
}
function renderResults(){
  const q=$("q").value.trim(), box=$("results"); box.innerHTML="";
  const list=PRODUCTS.filter(p=>{
    if(storeF==="fav" && !isFav(p.id)) return false;
    if(storeF!=="all" && storeF!=="fav" && p.store!==storeF && !(p.alsoAt||[]).includes(storeF)) return false;
    return match(p,q);
  });
  if(!list.length){box.innerHTML=`<p style="color:var(--muted);font-size:14px;">${storeF==="fav"&&!q?t("noFavs"):t("noResults")}</p>`;renderSpotlight();return;}
  list.forEach(p=>{ box.appendChild(makeCard(p)); renderResume(); });
  renderSpotlight();
}
$("q").addEventListener("input",renderResults);
function renderResume(){
  const card=$("resume-card"); if(!card) return;
  const p = PRODUCTS.find(x=>{ const pr=S.prog[x.id]; return pr && !pr.done && pr.step>0; });
  if(!p){ card.classList.add("hidden"); return; }
  const pr=S.prog[p.id];
  card.classList.remove("hidden");
  $("resume-title").textContent=t("resumeTitle");
  $("resume-sub").textContent=t("resumeSub")(p.name[S.lang], pr.step+1, p.steps.length);
  $("resume-btn").textContent=t("resumeBtn");
  $("resume-btn").onclick=e=>{ e.stopPropagation(); cur=p; step=pr.step; renderStep(); show("screen-guide"); window.scrollTo(0,0); };
  card.onclick=()=>{ cur=p; renderProduct(p); show("screen-product"); window.scrollTo(0,0); };
}
function toggleFav(id){
  S.favs = isFav(id) ? S.favs.filter(f=>f!==id) : S.favs.concat(id);
  save(); renderResults();
  if(cur && cur.id===id && !$("screen-product").classList.contains("hidden")) renderProduct(cur);
}

/* ---------- product ---------- */
function renderProduct(p){
  $("p-store").textContent=p.store; $("p-name").textContent=p.name[S.lang];
  $("p-meta").innerHTML=`<span>📦 ${t("sku")}: ${p.sku}</span><span>⏱ ${t("time")}: ${p.time[S.lang]}</span><span>📊 ${t("diff")}: ${p.diff[S.lang]}</span><span>🧩 ${p.steps.length} ${t("stepsLbl")}</span>`;
  $("p-blurb").textContent=p.blurb[S.lang];
  const pa=$("p-alsoat");
  if(p.alsoAt && p.alsoAt.length){ pa.classList.remove("hidden"); pa.textContent=`🏪 ${t("alsoAt")}: ${p.alsoAt.join(", ")}`; }
  else pa.classList.add("hidden");
  $("p-fav").textContent = isFav(p.id) ? t("removeFav") : t("addFav");
  $("p-prep").innerHTML =
    `<li><span>🧹 ${t("prepSpace")}</span><span class="qty">${p.space[S.lang]}</span></li>`+
    `<li><span>🧑‍🤝‍🧑 ${t("prepPeople")}</span><span class="qty">${p.people}</span></li>`+
    `<li><span>⏱ ${t("prepTime")}</span><span class="qty">${p.time[S.lang]}</span></li>`;
  $("p-parts").innerHTML=li(p.parts);
  const hasHw = p.hardware && p.hardware.length>0;
  $("t-hardware").style.display = hasHw?"":"none";
  $("p-hw").style.display = hasHw?"":"none";
  $("p-hw").innerHTML = hasHw?li(p.hardware):"";
  $("p-tools").textContent=p.tools[S.lang];
  $("p-surface").textContent="💡 "+p.surface[S.lang];
  $("p-anchor").classList.toggle("hidden", !p.anchor);
  if(p.anchor) $("p-anchor").textContent = t("anchorWarn");
  const prog = S.prog[p.id];
  const resumable = prog && !prog.done && prog.step>0;
  $("p-start").textContent = resumable ? t("resume")(prog.step+1) : t("start");
  $("p-reset").classList.toggle("hidden", !(prog && (prog.step>0 || prog.done)));
  const rn=$("p-resumenote");
  if(resumable){ rn.classList.remove("hidden"); rn.textContent=t("prepResumeNote")(prog.step+1); }
  else rn.classList.add("hidden");
  $("p-reset").textContent = t("restartGuide");
  $("p-back").textContent=t("back");
}
$("p-back").onclick=()=>{ renderResults(); show("screen-home"); };
$("p-fav").onclick=()=>{ if(cur) toggleFav(cur.id); };
$("p-start").onclick=()=>{
  const prog = S.prog[cur.id];
  step = (prog && !prog.done && prog.step>0) ? prog.step : 0;
  renderStep(); show("screen-guide"); window.scrollTo(0,0);
};
$("p-reset").onclick=()=>{ S.prog[cur.id]={step:0,done:false}; save(); renderProduct(cur); renderResults(); };

/* ---------- guide ---------- */
function renderStep(){
  stopSpeak();
  const oldV=$("g-video"); if(oldV){ try{oldV.pause();}catch(e){} }
  const s=cur.steps[step], n=cur.steps.length;
  S.prog[cur.id] = {step:step, done:false}; save();
  $("g-count").textContent=t("stepOf")(step+1,n);
  $("g-bar").style.width=((step+1)/n*100)+"%";
  $("g-title").textContent=s.title[S.lang];
  $("g-svg").innerHTML=scene(s.svg, s.arg);
  const vurl=stepVideo(cur.id, step), vw=$("g-video-wrap"), vv=$("g-video");
  if(vurl){ vw.classList.remove("hidden"); if(vv.getAttribute("src")!==vurl) vv.src=vurl; $("g-videotag").textContent=t("videoTag"); }
  else { vw.classList.add("hidden"); vv.removeAttribute("src"); try{vv.load();}catch(e){} }
  $("g-text").textContent=s.text[S.lang];
  if(s.tool){ $("g-tool").classList.remove("hidden"); $("g-tool").textContent="🔧 "+t("toolForStep")+": "+s.tool[S.lang]; }
  else $("g-tool").classList.add("hidden");
  $("g-parts").innerHTML=li(s.need);
  if(s.tip){$("g-tipwrap").style.display="";$("g-tip").textContent=s.tip[S.lang];}
  else $("g-tipwrap").style.display="none";
  $("g-say").textContent=t("play"); $("g-say").classList.remove("playing");
  $("g-prev").textContent=t("prev"); $("g-prev").style.visibility=step===0?"hidden":"visible";
  $("g-next").textContent=step===n-1?t("finish"):t("next");
  $("g-back").textContent=t("back");
}
$("g-prev").onclick=()=>{if(step>0){step--;renderStep();window.scrollTo(0,0);}};
$("g-next").onclick=()=>{
  stopSpeak();
  if(step<cur.steps.length-1){step++;renderStep();window.scrollTo(0,0);}
  else{ S.prog[cur.id]={step:step,done:true}; save(); renderDone(); show("screen-done"); window.scrollTo(0,0); }
};
$("g-back").onclick=()=>{stopSpeak();renderProduct(cur);show("screen-product");};

/* ---------- done ---------- */
function renderDone(){
  $("d-sub").textContent = t("doneText")(cur.name[S.lang]);
  const items = [t("checkTight"), t("checkStable")];
  if(cur.anchor) items.push(t("checkAnchor"));
  items.push(t("checkLeftovers"));
  $("d-checklist").innerHTML = items.map(x=>`<li><input type="checkbox"><span>${x}</span></li>`).join("");
}
$("d-restart").onclick=()=>{ S.prog[cur.id]={step:0,done:false}; save(); step=0; renderStep(); show("screen-guide"); window.scrollTo(0,0); };
$("d-home").onclick=()=>{ stopSpeak(); renderResults(); show("screen-home"); };

/* ---------- narration ---------- */
function stopSpeak(){ if("speechSynthesis" in window){ try{speechSynthesis.cancel();}catch(e){} } speaking=false;
  const b=$("g-say"); if(b){b.textContent=t("play");b.classList.remove("playing");} }
$("g-say").onclick=()=>{
  if(!("speechSynthesis" in window)) return;
  if(speaking){stopSpeak();return;}
  const s=cur.steps[step];
  const partsTxt = s.need.map(x=>x[0][S.lang]+" "+x[1]).join(", ");
  const u=new SpeechSynthesisUtterance(s.title[S.lang]+". "+s.text[S.lang]+" "+t("needParts")+": "+partsTxt+(s.tip?". "+s.tip[S.lang]:""));
  u.lang=VOICE[S.lang]; u.rate=S.rate;
  u.onend=()=>{speaking=false;$("g-say").textContent=t("play");$("g-say").classList.remove("playing");};
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  speaking=true; $("g-say").textContent=t("playing"); $("g-say").classList.add("playing");
};

/* ---------- scan manual (v1.1) ---------- */
function findBySkuOrName(txt){
  if(!txt) return null;
  const q=txt.trim().toLowerCase(); if(!q) return null;
  return PRODUCTS.find(p=>p.sku.toLowerCase()===q)
      || PRODUCTS.find(p=>p.sku.toLowerCase().includes(q) && q.length>=4)
      || PRODUCTS.find(p=>match(p, txt.trim())) || null;
}
function scanRun(){
  const txt=$("scan-sku").value, box=$("scan-result");
  const hit=findBySkuOrName(txt);
  if(hit){
    box.innerHTML=`<div class="note" style="background:#e8f7ee;border-color:#bfe6cf;color:#14532d;">${t("scanFound")}<br><strong>${hit.name[S.lang]}</strong> · ${hit.store} · ${t("sku")}: ${hit.sku}</div>
      <div style="margin-top:10px;"><button class="btn accent" id="scan-open"></button></div>`;
    $("scan-open").textContent=t("scanOpen");
    $("scan-open").onclick=()=>{ $("ov-scan").classList.add("hidden"); cur=hit; renderProduct(hit); show("screen-product"); window.scrollTo(0,0); };
  } else {
    const label=(txt||"").trim() || "—";
    if(label!=="—" && !S.want.some(w=>w.sku===label)){ S.want.push({sku:label, when:Date.now()}); save(); }
    box.innerHTML=`<div class="note">${t("scanNotFound")}</div><p style="font-size:13px;color:var(--muted);margin-top:8px;">${t("scanWantSaved")(S.want.length)}</p>`;
  }
}
$("btn-scan").onclick=()=>{ $("scan-result").innerHTML=""; $("ov-scan").classList.remove("hidden"); };
$("scan-close").onclick=()=>$("ov-scan").classList.add("hidden");
$("ov-scan").addEventListener("click",e=>{ if(e.target.id==="ov-scan") $("ov-scan").classList.add("hidden"); });
$("scan-pick").onclick=()=>$("scan-file").click();
$("scan-file").addEventListener("change",e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const img=$("scan-img");
  try{ img.src=URL.createObjectURL(f); }catch(err){}
  img.classList.remove("hidden");
  // Demo assist: camera file names sometimes carry the model/SKU — prefill any token that looks like one.
  const m=(f.name||"").replace(/\.[a-z0-9]+$/i,"").match(/[A-Za-z]{2,}[0-9]{3,}|[0-9]{6,}/);
  if(m && !$("scan-sku").value) $("scan-sku").value=m[0].toUpperCase();
});
$("scan-find").onclick=scanRun;
$("scan-sku").addEventListener("keydown",e=>{ if(e.key==="Enter") scanRun(); });

/* ---------- settings & premium ---------- */
$("btn-settings").onclick=()=>$("ov-settings").classList.remove("hidden");
$("set-close").onclick=()=>$("ov-settings").classList.add("hidden");
$("ov-settings").addEventListener("click",e=>{ if(e.target.id==="ov-settings") $("ov-settings").classList.add("hidden"); });
$("set-rate").addEventListener("input",e=>{ S.rate=parseFloat(e.target.value); save(); $("rate-val").textContent=t("speedVal")(S.rate.toFixed(2).replace(/0$/,"")); });
$("premium-banner").onclick=()=>$("ov-premium").classList.remove("hidden");
$("set-gopremium").onclick=()=>{ $("ov-settings").classList.add("hidden"); $("ov-premium").classList.remove("hidden"); };
$("buy-cancel").onclick=()=>$("ov-premium").classList.add("hidden");
$("ov-premium").addEventListener("click",e=>{ if(e.target.id==="ov-premium") $("ov-premium").classList.add("hidden"); });
$("buy-premium").onclick=()=>{
  const b=$("buy-premium"); b.disabled=true; b.textContent=t("processing");
  setTimeout(()=>{ S.premium=true; save(); b.disabled=false; b.textContent=t("buyDone");
    setTimeout(()=>{ $("ov-premium").classList.add("hidden"); renderChrome(); }, 700);
  }, 900);
};

applyBrand();
renderChrome();

/* ---------- deep links: ?p=<product-id> (also accepts a SKU) ----------
   The QR pack encodes one link per guide, e.g. ?p=sau409934.
   A valid link opens that guide's product screen on load. */
(function(){
  try{
    const pid=new URLSearchParams(window.location.search).get("p");
    if(!pid) return;
    const p=PRODUCTS.find(x=>x.id===pid)||PRODUCTS.find(x=>x.sku.toLowerCase()===String(pid).toLowerCase());
    if(p){ cur=p; renderProduct(p); show("screen-product"); window.scrollTo(0,0); }
  }catch(e){}
})();
</script>
</body>
</html>
