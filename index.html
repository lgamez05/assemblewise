 steps:[
  {svg:"unpack", title:L("Unpack and sort the panels","Desempaca y ordena los paneles","Déballez et triez les panneaux"),
   text:L("Lay out the desktop, both side panels, the back panel, the shelf and all the drawer pieces. Group the cam locks, dowels and screws in piles.","Acomoda la cubierta, los dos paneles laterales, el panel trasero, la repisa y todas las piezas del cajón. Agrupa levas, pernos y tornillos en montones.","Disposez le plateau, les deux panneaux latéraux, le panneau arrière, l'étagère et toutes les pièces du tiroir. Regroupez cames, goujons et vis en piles."),
   need:[[L("All panels + hardware","Todos los paneles + tornillería","Tous les panneaux + quincaillerie"),"×1"]],
   tip:L("Peel any protective film only after the build — it guards the laminate while you work.","Quita la película protectora solo al final — protege el laminado mientras trabajas.","Retirez le film protecteur seulement à la fin — il protège le stratifié pendant le montage.")},
  {svg:"cams", title:L("Fit the cam dowels","Coloca los pernos de leva","Posez les goujons de came"),
   text:L("Screw the cam dowels into the marked holes on the desktop underside and the side panels, by hand first, then a quarter turn with the screwdriver. They should stand straight and snug.","Atornilla los pernos en los agujeros marcados bajo la cubierta y en los paneles laterales, primero a mano y luego un cuarto de vuelta con el destornillador. Deben quedar rectos y firmes.","Vissez les goujons dans les trous marqués sous le plateau et sur les panneaux latéraux, d'abord à la main, puis un quart de tour au tournevis. Ils doivent être droits et fermes."),

   text:L("With the desktop face-down, slide each side panel onto its dowels so the cam holes line up. Drop in the cam locks and turn each one clockwise about half a turn until it grips.","Con la cubierta boca abajo, desliza cada panel lateral sobre sus pernos hasta alinear los agujeros de las levas. Mete las levas y gíralas en sentido horario media vuelta hasta que agarren.","Plateau face vers le bas, glissez chaque panneau latéral sur ses goujons jusqu'à aligner les trous des cames. Insérez les cames et tournez-les d'un demi-tour dans le sens horaire jusqu'à ce qu'elles accrochent."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Cam lock","Leva","Came"),"×6"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("The cam's arrow must point toward the incoming dowel before you turn it — backwards cams never grip.","La flecha de la leva debe apuntar hacia el perno antes de girarla — las levas al revés nunca agarran.","La flèche de la came doit pointer vers le goujon entrant avant de tourner — une came à l'envers n'accroche jamais.")},

   text:L("Slide the back modesty panel into its grooves between the side panels, then set the lower shelf on its dowels and lock its two cams. Check the frame is square by measuring both diagonals.","Desliza el panel trasero en sus ranuras entre los laterales y luego coloca la repisa baja sobre sus pernos y bloquea sus dos levas. Verifica que el marco esté a escuadra midiendo las dos diagonales.","Glissez le panneau arrière dans ses rainures entre les panneaux latéraux, puis posez l'étagère basse sur ses goujons et verrouillez ses deux cames. Vérifiez l'équerrage en mesurant les deux diagonales."),
   need:[[L("Back modesty panel","Panel trasero","Panneau arrière"),"×1"],[L("Lower shelf","Repisa baja","Étagère basse"),"×1"],[L("Cam lock","Leva","Came"),"×4"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Mount the drawer glides","Monta las correderas del cajón","Montez les glissières du tiroir"),

   need:[[L("Drawer front/sides/back/bottom","Frente/costados/trasera/fondo","Façade/côtés/dos/fond"),"×5"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×6"],[L("Handle + bolts","Tirador + pernos","Poignée + boulons"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},

   text:L("Unfold the back panel over the frame, align its edges, and nail around the perimeter every few inches. This panel is what makes the tall frame rigid — take your time.","Despliega el panel trasero sobre el marco, alinea los bordes y clava por el perímetro cada pocos centímetros. Este panel es el que da rigidez al marco alto — tómate tu tiempo.","Dépliez le panneau arrière sur le cadre, alignez les bords et clouez le périmètre tous les quelques centimètres. C'est ce panneau qui rigidifie le cadre haut — prenez votre temps."),
   need:[[L("Back panel (folding)","Panel trasero (plegable)","Panneau arrière (pliant)"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×16"]], tool:L("Hammer","Martillo","Marteau"),
   tip:L("If a nail misses the frame edge it pokes through inside — angle nails slightly inward.","Si un clavo falla el borde del marco, sale por dentro — inclina los clavos ligeramente hacia adentro.","Si un clou manque le bord du cadre, il ressort à l'intérieur — inclinez les clous légèrement vers l'intérieur.")},
  {svg:"shelf", title:L("Stand it up, add adjustable shelves","Páralo y agrega las repisas ajustables","Redressez et ajoutez les étagères réglables"),
   text:L("With two people, walk the bookcase upright against its wall. Push four shelf pins into the holes at each chosen height and rest the three adjustable shelves on them.","Entre dos, paren el librero contra su pared. Mete cuatro pernos por cada altura elegida y apoya las tres repisas ajustables sobre ellos.","À deux, redressez la bibliothèque contre son mur. Enfoncez quatre taquets à chaque hauteur choisie et posez les trois étagères réglables dessus."),
   need:[[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×3"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×12"]],
   tip:L("Count pin holes out loud from the top on both sides — mismatched heights are the classic wobble.","Cuenta los agujeros en voz alta desde arriba en ambos lados — alturas dispares son el tambaleo clásico.","Comptez les trous à voix haute depuis le haut des deux côtés — des hauteurs différentes sont la cause classique du vacillement.")},
  {svg:"anchor", title:L("Anchor to the wall","Anclaje a la pared","Ancrez au mur"),
   text:L("Fix the anchor strap to the top back of the bookcase and into a wall stud. A tall loaded bookcase must never stand unanchored, especially with kids in the house.","Fija la correa de anclaje a la parte trasera superior del librero y a un montante de la pared. Un librero alto y cargado nunca debe quedar sin anclar, y menos con niños en casa.","Fixez la sangle d'ancrage en haut à l'arrière de la bibliothèque et dans un montant du mur. Une bibliothèque haute et chargée ne doit jamais rester sans ancrage, surtout avec des enfants à la maison."),
   need:[[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"level", title:L("Level and load check","Nivelación y prueba de carga","Niveau et test de charge"),
   text:L("Check the unit stands plumb, load books evenly across shelves rather than all on one side, and re-tighten the base screws. Done!","Verifica que quede a plomo, carga los libros parejo en las repisas y no todos de un lado, y reaprieta los tornillos del zócalo. ¡Listo!","Vérifiez l'aplomb, chargez les livres uniformément sur les étagères plutôt que d'un seul côté, et resserrez les vis de la plinthe. Terminé !"),
   need:[[L("Screw","Tornillo","Vis"),"×10"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")}
 ]},
/* ---------- 15 · Ashley — Signature Design chest ---------- */
{ id:"ashb181", store:"Ashley", sku:"B181-46", anchor:true,
 name:L("Signature Design by Ashley Paxberry 5-Drawer Chest","Cómoda de 5 cajones Paxberry de Signature Design by Ashley","Commode 5 tiroirs Paxberry Signature Design by Ashley"),
 blurb:L("Tall five-drawer chest with smooth ball-bearing glides — the bedroom storage workhorse.","Cómoda alta de cinco cajones con correderas de baleros suaves — el caballo de batalla del cuarto.","Commode haute à cinq tiroirs avec glissières à billes fluides — la bête de somme de la chambre."),
 time:L("~75 min","~75 min","~75 min"), diff:L("Medium–Hard","Media–Difícil","Moyenne–Difficile"),
 space:L("About 2 × 1.5 m of clear floor","Unos 2 × 1.5 m de piso libre","Environ 2 × 1,5 m de sol libre"), people:"2",
 parts:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Bottom/base frame","Marco inferior/base","Cadre inférieur/base"),"×1"],[L("Drawer divider rail","Riel divisor de cajones","Rail séparateur de tiroirs"),"×4"],[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Drawer front","Frente de cajón","Façade de tiroir"),"×5"],[L("Drawer side","Costado de cajón","Côté de tiroir"),"×10"],[L("Drawer back","Trasera de cajón","Dos de tiroir"),"×5"],[L("Drawer bottom","Fondo de cajón","Fond de tiroir"),"×5"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×40"],[L("Ball-bearing glide set","Juego de correderas de baleros","Jeu de glissières à billes"),"×5"],[L("Drawer pull + bolts","Jaladera + pernos","Poignée + boulons"),"×5"],[L("Anti-tip restraint kit","Kit antivuelco","Kit anti-basculement"),"×1"]],
 tools:L("Phillips screwdriver, hammer, and a drill for the anti-tip step. Two people for the tall frame.","Destornillador Phillips, martillo y taladro para el paso antivuelco. Dos personas para el marco alto.","Tournevis Phillips, marteau et perceuse pour l'étape anti-basculement. Deux personnes pour le cadre haut."),
 surface:L("Build the tall frame lying down on a blanket and keep drawers out until it stands anchored. Five drawers open at once can tip any chest — install the restraint before loading.","Arma el marco alto acostado sobre una cobija y deja los cajones fuera hasta que esté parado y anclado. Cinco cajones abiertos a la vez vuelcan cualquier cómoda — instala el antivuelco antes de cargar.","Montez le cadre haut à plat sur une couverture et gardez les tiroirs dehors jusqu'à ce qu'il soit debout et ancré. Cinq tiroirs ouverts en même temps renversent n'importe quelle commode — installez le kit avant de charger."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort by drawer","Desempaca y ordena por cajón","Déballez et triez par tiroir"),
   text:L("Make five piles — one per drawer (front, two sides, back, bottom) — plus the frame panels and the five glide sets. Tall chests reward patience at this stage.","Haz cinco montones — uno por cajón (frente, dos costados, trasera, fondo) — más los paneles del marco y los cinco juegos de correderas. Las cómodas altas agradecen la paciencia en esta etapa.","Faites cinq piles — une par tiroir (façade, deux côtés, dos, fond) — plus les panneaux du cadre et les cinq jeux de glissières. Les commodes hautes récompensent la patience à cette étape."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw dowels into the top panel, base frame and divider rails; seat the cam locks in the side panels with arrows toward the dowel holes.","Atornilla los pernos en el panel superior, la base y los rieles divisores; asienta las levas en los laterales con las flechas hacia los agujeros.","Vissez les goujons dans le panneau supérieur, la base et les rails séparateurs ; placez les cames dans les panneaux latéraux, flèches vers les trous."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:3, title:L("Build the tall frame","Arma el marco alto","Assemblez le cadre haut"),
   text:L("Lying flat, join the base, the four divider rails and the top panel between the side panels, locking each cam as you go. The rails set the drawer openings — spacing must match top to bottom.","Acostado, une la base, los cuatro rieles divisores y el panel superior entre los laterales, bloqueando cada leva al avanzar. Los rieles marcan los huecos de los cajones — el espacio debe coincidir de arriba abajo.","À plat, joignez la base, les quatre rails séparateurs et le panneau supérieur entre les panneaux latéraux, en verrouillant chaque came. Les rails définissent les ouvertures des tiroirs — l'espacement doit correspondre de haut en bas."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Drawer divider rail","Riel divisor de cajones","Rail séparateur de tiroirs"),"×4"],[L("Top panel + base frame","Panel superior + base","Panneau supérieur + base"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Back panel on","Coloca el panel trasero","Posez le panneau arrière"),
   text:L("Square the frame by its diagonals, then fix the back panel with screws around the perimeter and into the divider rails.","Cuadra el marco con las diagonales y luego fija el panel trasero con tornillos por el perímetro y hacia los rieles divisores.","Équerrez le cadre par ses diagonales, puis fixez le panneau arrière avec des vis sur le périmètre et dans les rails séparateurs."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×16"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Mount ten glide halves","Monta las diez mitades de corredera","Montez les dix moitiés de glissières"),
   text:L("Stand the frame up with help. Separate the five ball-bearing glide sets and screw the cabinet halves at the five drawer heights — level and matched on both sides. Keep the drawer halves with their drawer piles.","Paren el marco entre dos. Separen los cinco juegos de correderas de baleros y atornillen las mitades del mueble a las cinco alturas — niveladas y parejas en ambos lados. Las mitades del cajón van con sus montones.","Redressez le cadre à deux. Séparez les cinq jeux de glissières à billes et vissez les moitiés côté meuble aux cinq hauteurs — de niveau et assorties des deux côtés. Les moitiés tiroir restent avec leurs piles."),
   need:[[L("Ball-bearing glide set","Juego de correderas de baleros","Jeu de glissières à billes"),"×5"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×20"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("Ball-bearing glides separate with a small black lever — don't force them apart by pulling.","Las correderas de baleros se separan con una palanquita negra — no las fuerces jalando.","Les glissières à billes se séparent par un petit levier noir — ne forcez pas en tirant.")},
  {svg:"drawer", title:L("Build the five drawers","Arma los cinco cajones","Montez les cinq tiroirs"),
   text:L("Repeat for each pile: box (sides, back, bottom), front panel flush at the top, glide halves, and the pull. Work top drawer to bottom so fronts align in a column.","Repite por cada montón: caja (costados, trasera, fondo), frente a ras arriba, mitades de corredera y jaladera. Trabaja del cajón superior al inferior para que los frentes queden en columna.","Répétez pour chaque pile : boîte (côtés, dos, fond), façade affleurante en haut, moitiés de glissières et poignée. Travaillez du tiroir supérieur vers le bas pour aligner les façades en colonne."),
   need:[[L("Drawer pieces (per drawer)","Piezas de cajón (por cajón)","Pièces de tiroir (par tiroir)"),"×5"],[L("Drawer pull + bolts","Jaladera + pernos","Poignée + boulons"),"×5"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"anchor", title:L("Install the anti-tip restraint","Instala el antivuelco","Installez le kit anti-basculement"),
   text:L("Before any drawer goes in: fix the anti-tip restraint from the chest's top back edge into a wall stud with the drill. This is the step that keeps a tall chest from ever tipping forward.","Antes de meter cualquier cajón: fija el antivuelco desde el borde trasero superior de la cómoda a un montante de la pared con el taladro. Este es el paso que evita que una cómoda alta se vuelque hacia adelante.","Avant tout tiroir : fixez le kit anti-basculement du bord arrière supérieur de la commode dans un montant du mur avec la perceuse. C'est l'étape qui empêche une commode haute de basculer vers l'avant."),
   need:[[L("Anti-tip restraint kit","Kit antivuelco","Kit anti-basculement"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"tighten", title:L("Drawers in, final alignment","Cajones adentro, alineación final","Tiroirs en place, alignement final"),
   text:L("Slide the drawers in top to bottom, checking each front sits flush and gaps look even. Open one drawer at a time only — and re-check every cam lock to finish.","Mete los cajones de arriba abajo, revisando que cada frente quede a ras y los espacios parejos. Abre un solo cajón a la vez — y revisa cada leva para terminar.","Glissez les tiroirs de haut en bas, en vérifiant que chaque façade affleure et que les écarts sont réguliers. N'ouvrez qu'un tiroir à la fois — et revérifiez chaque came pour finir."),
   need:[[L("Assembled drawers","Cajones armados","Tiroirs assemblés"),"×5"]],
   tip:L("Slightly uneven front gaps usually mean a glide sits one screw-hole off — check before forcing anything.","Frentes un poco disparejos suelen significar una corredera corrida por un agujero — revisa antes de forzar nada.","Des façades légèrement inégales signifient souvent une glissière décalée d'un trou de vis — vérifiez avant de forcer.")}
 ]},

{ id:"sau415109", store:"Amazon", alsoAt:["Walmart","Wayfair","Target"], sku:"415109", anchor:false, brand:"Sauder",
 name:L("Sauder Harbor View Computer Desk","Escritorio para computadora Sauder Harbor View","Bureau d'ordinateur Sauder Harbor View"),
 blurb:L("Computer desk with a raised hutch, two pedestals, a keyboard tray and a file drawer — the home-office centerpiece of the Harbor View collection.","Escritorio para computadora con repisa elevada, dos pedestales, bandeja para teclado y cajón archivero — la pieza central de oficina en casa de la colección Harbor View.","Bureau d'ordinateur avec surmeuble, deux caissons, tablette clavier et tiroir classeur — la pièce maîtresse du bureau à domicile de la collection Harbor View."),
 time:L("~75 min","~75 min","~75 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 2 × 1.5 m of clear floor","Unos 2 × 1.5 m de piso libre","Environ 2 × 1,5 m de sol libre"), people:"2",
 parts:[[L("Desktop","Cubierta","Plateau"),"×1"],[L("Hutch top shelf","Repisa superior de la repisa elevada","Étagère haute du surmeuble"),"×1"],[L("Hutch upright","Montante de la repisa","Montant du surmeuble"),"×2"],[L("Back modesty panel","Panel trasero","Panneau arrière"),"×1"],[L("Pedestal side","Lateral de pedestal","Côté de caisson"),"×4"],[L("Pedestal back","Trasera de pedestal","Dos de caisson"),"×2"],[L("Drawer front","Frente de cajón","Façade de tiroir"),"×2"],[L("Drawer side","Costado de cajón","Côté de tiroir"),"×4"],[L("Drawer back","Trasera de cajón","Dos de tiroir"),"×2"],[L("Drawer bottom","Fondo de cajón","Fond de tiroir"),"×2"],[L("Keyboard tray","Bandeja para teclado","Tablette clavier"),"×1"],[L("CPU door","Puerta del CPU","Porte du boîtier"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×16"],[L("Wood dowel","Taquete de madera","Cheville en bois"),"×12"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×28"],[L("Drawer glide set","Juego de correderas","Jeu de glissières"),"×2"],[L("Keyboard tray glide","Corredera de bandeja","Glissière de tablette"),"×2"],[L("Door hinge","Bisagra","Charnière"),"×2"],[L("Knob + bolt","Perilla + perno","Bouton + boulon"),"×3"],[L("Hanging file bar","Barra para carpetas","Barre pour dossiers"),"×2"]],
 tools:L("Phillips screwdriver, hammer, and a second person for the hutch and the flip.","Destornillador Phillips, martillo y una segunda persona para la repisa elevada y el volteo.","Tournevis Phillips, marteau et une deuxième personne pour le surmeuble et le redressement."),
 surface:L("Build the pedestals and hutch flat on a blanket, then assemble on the desktop. Laminate edges chip if panels drag on hard floors.","Arma los pedestales y la repisa acostados sobre una cobija y luego ensambla sobre la cubierta. Los bordes laminados se astillan si los paneles se arrastran en pisos duros.","Montez les caissons et le surmeuble à plat sur une couverture, puis assemblez sur le plateau. Les bords stratifiés s'écaillent si les panneaux glissent sur sol dur."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort into three zones","Desempaca y ordena en tres zonas","Déballez et triez en trois zones"),
   text:L("Make three piles: desk body (desktop, pedestals, back panel), hutch (uprights and top shelf), and drawers plus keyboard tray. Keep each pile's hardware in its own small bowl.","Haz tres montones: cuerpo del escritorio (cubierta, pedestales, panel trasero), repisa elevada (montantes y repisa superior) y cajones más la bandeja del teclado. La tornillería de cada montón en su propio tazón.","Faites trois piles : corps du bureau (plateau, caissons, panneau arrière), surmeuble (montants et étagère haute), et tiroirs plus tablette clavier. La quincaillerie de chaque pile dans son propre petit bol."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]],
   tip:L("Desks with hutches have look-alike panels — check each edge for the finished face before building.","Los escritorios con repisa tienen paneles muy parecidos — revisa cada borde y busca la cara terminada antes de armar.","Les bureaux avec surmeuble ont des panneaux qui se ressemblent — vérifiez chaque bord pour la face finie avant de monter.")},
  {svg:"cams", title:L("Fit dowels and cam locks","Coloca taquetes y levas","Posez chevilles et cames"),
   text:L("Screw cam dowels into the desktop underside and the pedestal sides, and press wood dowels into the matching edges. Seat cam locks with their arrows facing the dowel holes.","Atornilla los pernos de leva bajo la cubierta y en los laterales de los pedestales, y mete los taquetes de madera en los bordes correspondientes. Asienta las levas con las flechas hacia los agujeros de los pernos.","Vissez les goujons de came sous le plateau et sur les côtés des caissons, et enfoncez les chevilles en bois dans les bords correspondants. Placez les cames, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×16"],[L("Wood dowel","Taquete de madera","Cheville en bois"),"×12"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"panels", title:L("Build the two pedestals","Arma los dos pedestales","Montez les deux caissons"),
   text:L("Join each pedestal's two sides to its back panel, turning the cam locks as you go. The pedestal with the wider drawer opening is the file side — keep it separate and labeled in your head.","Une los dos laterales de cada pedestal a su panel trasero, girando las levas al avanzar. El pedestal con el hueco de cajón más ancho es el lado archivero — mantenlo identificado.","Joignez les deux côtés de chaque caisson à son panneau arrière, en tournant les cames au fur et à mesure. Le caisson avec la plus grande ouverture de tiroir est le côté classeur — gardez-le identifié."),
   need:[[L("Pedestal side","Lateral de pedestal","Côté de caisson"),"×4"],[L("Pedestal back","Trasera de pedestal","Dos de caisson"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Join pedestals to the desktop","Une los pedestales a la cubierta","Joignez les caissons au plateau"),
   text:L("With the desktop face-down, set both pedestals onto their dowels and lock every cam. Slide the back modesty panel into its grooves, then measure both diagonals — equal means square.","Con la cubierta boca abajo, coloca ambos pedestales sobre sus pernos y bloquea cada leva. Desliza el panel trasero en sus ranuras y mide las dos diagonales — iguales significa a escuadra.","Plateau face vers le bas, posez les deux caissons sur leurs goujons et verrouillez chaque came. Glissez le panneau arrière dans ses rainures, puis mesurez les deux diagonales — égales signifie d'équerre."),
   need:[[L("Desktop","Cubierta","Plateau"),"×1"],[L("Back modesty panel","Panel trasero","Panneau arrière"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Mount the drawer glides","Monta las correderas","Montez les glissières"),
   text:L("Flip the desk upright with help. Separate the two glide sets and screw the cabinet halves inside both pedestals at the marked heights, dead level and matched side to side.","Voltea el escritorio con ayuda. Separa los dos juegos de correderas y atornilla las mitades del mueble dentro de ambos pedestales a las alturas marcadas, bien niveladas y parejas de lado a lado.","Redressez le bureau à deux. Séparez les deux jeux de glissières et vissez les moitiés côté meuble dans les deux caissons aux hauteurs marquées, bien de niveau et assorties des deux côtés."),
   need:[[L("Drawer glide set","Juego de correderas","Jeu de glissières"),"×2"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×12"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"drawer", title:L("Build both drawers","Arma ambos cajones","Montez les deux tiroirs"),
   text:L("Build each drawer box (sides, back, bottom), fix its front flush at the top, and add the drawer glide halves and knobs. The deep file drawer also takes the two hanging file bars across its top edges.","Arma cada caja de cajón (costados, trasera, fondo), fija su frente a ras arriba y agrega las mitades de corredera y las perillas. El cajón archivero profundo lleva además las dos barras para carpetas en sus bordes superiores.","Montez chaque boîte de tiroir (côtés, dos, fond), fixez sa façade affleurante en haut, et ajoutez les moitiés de glissières et les boutons. Le tiroir classeur profond reçoit aussi les deux barres pour dossiers sur ses bords supérieurs."),
   need:[[L("Drawer pieces (per drawer)","Piezas de cajón (por cajón)","Pièces de tiroir (par tiroir)"),"×5"],[L("Knob + bolt","Perilla + perno","Bouton + boulon"),"×2"],[L("Hanging file bar","Barra para carpetas","Barre pour dossiers"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"drawer", title:L("Fit the keyboard tray","Instala la bandeja del teclado","Installez la tablette clavier"),
   text:L("Screw the two tray glides under the desktop, centered between the pedestals, then slide the keyboard tray in until it stops. It should glide without rubbing either pedestal.","Atornilla las dos correderas de la bandeja bajo la cubierta, centradas entre los pedestales, y desliza la bandeja hasta el tope. Debe deslizar sin rozar ningún pedestal.","Vissez les deux glissières de la tablette sous le plateau, centrées entre les caissons, puis glissez la tablette jusqu'à la butée. Elle doit glisser sans frotter les caissons."),
   need:[[L("Keyboard tray","Bandeja para teclado","Tablette clavier"),"×1"],[L("Keyboard tray glide","Corredera de bandeja","Glissière de tablette"),"×2"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("Route the keyboard cable through the back gap before the hutch goes on — it is much harder afterwards.","Pasa el cable del teclado por el hueco trasero antes de poner la repisa — después es mucho más difícil.","Passez le câble du clavier par l'espace arrière avant de poser le surmeuble — c'est bien plus difficile après.")},
  {svg:"frame", arg:1, title:L("Set the hutch on top","Coloca la repisa elevada","Posez le surmeuble"),
   text:L("With two people, lower the hutch uprights onto the desktop's rear dowels, set the hutch top shelf across them and lock its cams. The hutch back edge should sit flush with the desktop's back edge.","Entre dos, bajen los montantes de la repisa sobre los pernos traseros de la cubierta, coloquen la repisa superior encima y bloqueen sus levas. El borde trasero de la repisa debe quedar a ras con el borde trasero de la cubierta.","À deux, abaissez les montants du surmeuble sur les goujons arrière du plateau, posez l'étagère haute dessus et verrouillez ses cames. Le bord arrière du surmeuble doit affleurer le bord arrière du plateau."),
   need:[[L("Hutch upright","Montante de la repisa","Montant du surmeuble"),"×2"],[L("Hutch top shelf","Repisa superior de la repisa elevada","Étagère haute du surmeuble"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"level", title:L("Hang the door and final check","Cuelga la puerta y revisión final","Accrochez la porte et contrôle final"),
   text:L("Screw the hinges to the CPU door and the pedestal, hang the door and adjust until its gap is even. Slide the drawers in, level the desk by its feet, and re-check every cam lock.","Atornilla las bisagras a la puerta del CPU y al pedestal, cuelga la puerta y ajusta hasta que el espacio quede parejo. Mete los cajones, nivela el escritorio con sus pies y revisa cada leva.","Vissez les charnières à la porte du boîtier et au caisson, accrochez la porte et réglez jusqu'à un écart régulier. Glissez les tiroirs, mettez le bureau de niveau par ses pieds et revérifiez chaque came."),

{ id:"sau413031", store:"Wayfair", alsoAt:["Amazon","Walmart"], sku:"413031", anchor:true, brand:"Sauder",

 time:L("~60 min","~60 min","~60 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 2 × 1 m of clear floor (build it lying down)","Unos 2 × 1 m de piso libre (se arma acostado)","Environ 2 × 1 m de sol libre (montage à plat)"), people:"2",
 parts:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Fixed shelf","Repisa fija","Étagère fixe"),"×2"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×3"],[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Crown molding","Moldura superior","Moulure supérieure"),"×1"],[L("Base molding","Moldura de base","Moulure de base"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×10"],[L("Screw","Tornillo","Vis"),"×12"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×12"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×18"],[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]],
 tools:L("Phillips screwdriver, hammer, and a drill for anchoring. Two people — it is tall.","Destornillador Phillips, martillo y taladro para el anclaje. Dos personas — es alto.","Tournevis Phillips, marteau et perceuse pour l'ancrage. Deux personnes — elle est haute."),

 steps:[
  {svg:"unpack", title:L("Unpack and lay out flat","Desempaca y acomoda acostado","Déballez et disposez à plat"),
   text:L("Lay the two tall side panels parallel with the top, the two fixed shelves and the base between them. Set the moldings and adjustable shelves aside — they go on last.","Pon los dos paneles laterales largos en paralelo con el superior, las dos repisas fijas y la base entre ellos. Deja aparte las molduras y las repisas ajustables — van al final.","Posez les deux longs panneaux latéraux parallèles avec le panneau supérieur, les deux étagères fixes et la base entre eux. Mettez de côté les moulures et les étagères réglables — elles vont en dernier."),
   need:[[L("All panels + hardware","Todos los paneles + tornillería","Tous les panneaux + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the top panel and both fixed shelves. Seat the cam locks in the side panels with arrows facing the dowel holes.","Atornilla los pernos en el panel superior y en ambas repisas fijas. Asienta las levas en los laterales con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans le panneau supérieur et les deux étagères fixes. Placez les cames dans les panneaux latéraux, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×10"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:2, title:L("Join the frame lying down","Une el marco acostado","Joignez le cadre à plat"),
   text:L("Connect the top, both fixed shelves and the base between the side panels, turning each cam lock fully as you go. Keep the whole frame flat and its front edges aligned.","Une el panel superior, ambas repisas fijas y la base entre los laterales, girando cada leva por completo al avanzar. Mantén todo el marco plano y los bordes frontales alineados.","Reliez le panneau supérieur, les deux étagères fixes et la base entre les panneaux latéraux, en tournant chaque came à fond. Gardez tout le cadre à plat et les bords avant alignés."),
   need:[[L("Fixed shelf","Repisa fija","Étagère fixe"),"×2"],[L("Top panel + base","Panel superior + base","Panneau supérieur + base"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Nail on the back panel","Clava el panel trasero","Clouez le panneau arrière"),
   text:L("Center the back panel over the frame and nail around the perimeter every few inches, checking the diagonals first. This panel is what makes the tall frame rigid.","Centra el panel trasero sobre el marco y clava por el perímetro cada pocos centímetros, revisando primero las diagonales. Este panel es el que da rigidez al marco alto.","Centrez le panneau arrière sur le cadre et clouez le périmètre tous les quelques centimètres, après avoir vérifié les diagonales. C'est ce panneau qui rigidifie le cadre haut."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×18"]], tool:L("Hammer","Martillo","Marteau")},
  {svg:"panels", title:L("Add the crown and base moldings","Coloca las molduras superior y de base","Posez les moulures supérieure et de base"),
   text:L("Stand the bookcase up with two people, against its wall. Screw the crown molding across the top front and the base molding across the bottom front — these give Palladia its framed look.","Paren el librero entre dos, contra su pared. Atornilla la moldura superior al frente arriba y la moldura de base al frente abajo — ellas le dan a Palladia su aspecto enmarcado.","Redressez la bibliothèque à deux, contre son mur. Vissez la moulure supérieure en haut à l'avant et la moulure de base en bas à l'avant — elles donnent à Palladia son aspect encadré."),
   need:[[L("Crown molding","Moldura superior","Moulure supérieure"),"×1"],[L("Base molding","Moldura de base","Moulure de base"),"×1"],[L("Screw","Tornillo","Vis"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"shelf", title:L("Set the adjustable shelves","Coloca las repisas ajustables","Posez les étagères réglables"),
   text:L("Push four shelf pins into each chosen height — count holes from the top out loud on both sides so they match — then rest the three adjustable shelves on the pins.","Mete cuatro pernos por cada altura elegida — cuenta los agujeros desde arriba en voz alta en ambos lados para que coincidan — y apoya las tres repisas ajustables sobre los pernos.","Enfoncez quatre taquets à chaque hauteur choisie — comptez les trous depuis le haut à voix haute des deux côtés pour qu'ils correspondent — puis posez les trois étagères réglables sur les taquets."),
   need:[[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×3"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×12"]],
   tip:L("Leave one tall opening for binders or a plant — adjustable shelves earn their keep when plans change.","Deja un hueco alto para carpetas o una planta — las repisas ajustables valen cuando cambian los planes.","Laissez un grand espace pour des classeurs ou une plante — les étagères réglables prouvent leur valeur quand les plans changent.")},
  {svg:"anchor", title:L("Anchor to the wall","Anclaje a la pared","Ancrez au mur"),
   text:L("Fix the anchor strap to the top back of the bookcase and into a wall stud with the drill. A tall, loaded bookcase must never stand unanchored — especially around kids.","Fija la correa de anclaje a la parte trasera superior del librero y a un montante de la pared con el taladro. Un librero alto y cargado nunca debe quedar sin anclar — y menos cerca de niños.","Fixez la sangle d'ancrage en haut à l'arrière de la bibliothèque et dans un montant du mur avec la perceuse. Une bibliothèque haute et chargée ne doit jamais rester sans ancrage — surtout près d'enfants."),
   need:[[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"level", title:L("Level and load evenly","Nivela y carga parejo","Niveau et chargement régulier"),
   text:L("Check the bookcase stands plumb, spread heavy books across the fixed shelves instead of stacking them on one adjustable shelf, and press each shelf corner to confirm it is seated.","Verifica que el librero quede a plomo, reparte los libros pesados en las repisas fijas en vez de apilarlos en una sola ajustable, y presiona cada esquina de repisa para confirmar que asentó.","Vérifiez l'aplomb de la bibliothèque, répartissez les livres lourds sur les étagères fixes plutôt que de les empiler sur une seule étagère réglable, et pressez chaque coin d'étagère pour confirmer qu'elle est assise."),
   need:[[L("Screw","Tornillo","Vis"),"×4"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},

{ id:"sau409934", store:"Walmart", alsoAt:["Amazon","Target","Wayfair"], sku:"409934", anchor:true, brand:"Sauder",
 name:L("Sauder Shoal Creek Dresser","Cómoda Sauder Shoal Creek","Commode Sauder Shoal Creek"),
 blurb:L("Six-drawer dresser with deep drawers and metal runners — the bedroom anchor of the Shoal Creek collection.","Cómoda de seis cajones profundos con correderas metálicas — la pieza central del cuarto de la colección Shoal Creek.","Commode six tiroirs profonds à glissières métalliques — la pièce maîtresse de la chambre de la collection Shoal Creek."),
 time:L("~80 min","~80 min","~80 min"), diff:L("Medium–Hard","Media–Difícil","Moyenne–Difficile"),
 space:L("About 2 × 1.5 m of clear floor","Unos 2 × 1.5 m de piso libre","Environ 2 × 1,5 m de sol libre"), people:"2",
 parts:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Bottom panel","Panel inferior","Panneau inférieur"),"×1"],[L("Drawer divider rail","Riel divisor de cajones","Rail séparateur de tiroirs"),"×2"],[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Drawer front","Frente de cajón","Façade de tiroir"),"×6"],[L("Drawer side","Costado de cajón","Côté de tiroir"),"×12"],[L("Drawer back","Trasera de cajón","Dos de tiroir"),"×6"],[L("Drawer bottom","Fondo de cajón","Fond de tiroir"),"×6"],[L("Base rail","Riel de base","Rail de base"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×36"],[L("Metal glide set","Juego de correderas metálicas","Jeu de glissières métalliques"),"×6"],[L("Drawer pull + bolts","Jaladera + pernos","Poignée + boulons"),"×6"],[L("Anti-tip restraint kit","Kit antivuelco","Kit anti-basculement"),"×1"]],
 tools:L("Phillips screwdriver, hammer, and a drill for the anti-tip step. Two people for the frame.","Destornillador Phillips, martillo y taladro para el paso antivuelco. Dos personas para el marco.","Tournevis Phillips, marteau et perceuse pour l'étape anti-basculement. Deux personnes pour le cadre."),
 surface:L("Build the frame lying down on a blanket; drawers go in only after the dresser stands anchored. Six drawers reward sorting before you start.","Arma el marco acostado sobre una cobija; los cajones van solo cuando la cómoda esté parada y anclada. Seis cajones agradecen ordenar antes de empezar.","Montez le cadre à plat sur une couverture ; les tiroirs ne vont en place qu'une fois la commode debout et ancrée. Six tiroirs récompensent le tri avant de commencer."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort by drawer","Desempaca y ordena por cajón","Déballez et triez par tiroir"),
   text:L("Make six piles — one per drawer (front, two sides, back, bottom, pull) — plus the frame panels and the six glide sets. Label the piles top to bottom with sticky notes if you have them.","Haz seis montones — uno por cajón (frente, dos costados, trasera, fondo, jaladera) — más los paneles del marco y los seis juegos de correderas. Etiqueta los montones de arriba abajo con notas adhesivas si tienes.","Faites six piles — une par tiroir (façade, deux côtés, dos, fond, poignée) — plus les panneaux du cadre et les six jeux de glissières. Étiquetez les piles de haut en bas avec des notes adhésives si vous en avez."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw dowels into the top panel, bottom panel, divider rails and base rail. Seat cam locks in the side panels with arrows toward the dowel holes.","Atornilla los pernos en el panel superior, el inferior, los rieles divisores y el riel de base. Asienta las levas en los laterales con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans le panneau supérieur, l'inférieur, les rails séparateurs et le rail de base. Placez les cames dans les panneaux latéraux, flèches vers les trous."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×14"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:3, title:L("Build the dresser frame","Arma el marco de la cómoda","Assemblez le cadre de la commode"),
   text:L("Lying flat, join the bottom, the two divider rails, the base rail and the top between the side panels, locking each cam as you go. The rails set the drawer openings — spacing must match on both sides.","Acostado, une el panel inferior, los dos rieles divisores, el riel de base y el superior entre los laterales, bloqueando cada leva al avanzar. Los rieles marcan los huecos de los cajones — el espacio debe coincidir en ambos lados.","À plat, joignez le panneau inférieur, les deux rails séparateurs, le rail de base et le panneau supérieur entre les côtés, en verrouillant chaque came. Les rails définissent les ouvertures — l'espacement doit correspondre des deux côtés."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Drawer divider rail","Riel divisor de cajones","Rail séparateur de tiroirs"),"×2"],[L("Top + bottom + base rail","Superior + inferior + riel de base","Supérieur + inférieur + rail de base"),"×3"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Attach the back panel","Fija el panel trasero","Fixez le panneau arrière"),
   text:L("Square the frame by measuring both diagonals, then fix the back panel with screws around the perimeter and into the divider rails.","Cuadra el marco midiendo las dos diagonales y luego fija el panel trasero con tornillos por el perímetro y hacia los rieles divisores.","Équerrez le cadre en mesurant les deux diagonales, puis fixez le panneau arrière avec des vis sur le périmètre et dans les rails séparateurs."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×16"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Mount the twelve glide halves","Monta las doce mitades de corredera","Montez les douze moitiés de glissières"),
   text:L("Stand the frame up with help. Separate the six glide sets and screw the cabinet halves at the six drawer heights — level and matched on both sides. Keep each drawer half with its pile.","Paren el marco entre dos. Separen los seis juegos de correderas y atornillen las mitades del mueble a las seis alturas — niveladas y parejas en ambos lados. Cada mitad de cajón va con su montón.","Redressez le cadre à deux. Séparez les six jeux de glissières et vissez les moitiés côté meuble aux six hauteurs — de niveau et assorties des deux côtés. Chaque moitié tiroir reste avec sa pile."),
   need:[[L("Metal glide set","Juego de correderas metálicas","Jeu de glissières métalliques"),"×6"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×20"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("Work one column at a time and measure from the top panel down — cumulative eyeballing is how drawers end up crooked.","Trabaja una columna a la vez y mide desde el panel superior hacia abajo — medir a ojo acumulando es como los cajones terminan chuecos.","Travaillez une colonne à la fois et mesurez depuis le panneau supérieur vers le bas — l'estimation cumulative est la cause des tiroirs de travers.")},
  {svg:"drawer", title:L("Build the six drawers","Arma los seis cajones","Montez les six tiroirs"),
   text:L("Repeat for each pile: box (sides, back, bottom), front panel flush at the top, glide halves, and the pull. Build top-row drawers first so the fronts form two even columns.","Repite por cada montón: caja (costados, trasera, fondo), frente a ras arriba, mitades de corredera y jaladera. Arma primero los cajones de arriba para que los frentes formen dos columnas parejas.","Répétez pour chaque pile : boîte (côtés, dos, fond), façade affleurante en haut, moitiés de glissières et poignée. Montez d'abord les tiroirs du haut pour que les façades forment deux colonnes régulières."),
   need:[[L("Drawer pieces (per drawer)","Piezas de cajón (por cajón)","Pièces de tiroir (par tiroir)"),"×5"],[L("Drawer pull + bolts","Jaladera + pernos","Poignée + boulons"),"×6"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"anchor", title:L("Install the anti-tip restraint","Instala el antivuelco","Installez le kit anti-basculement"),
   text:L("Before any drawer goes in: fix the anti-tip restraint from the dresser's top back edge into a wall stud with the drill. Open drawers shift the weight forward — this strap is what keeps the dresser safe.","Antes de meter cualquier cajón: fija el antivuelco desde el borde trasero superior de la cómoda a un montante de la pared con el taladro. Los cajones abiertos mueven el peso hacia adelante — esta correa es lo que mantiene la cómoda segura.","Avant tout tiroir : fixez le kit anti-basculement du bord arrière supérieur de la commode dans un montant du mur avec la perceuse. Les tiroirs ouverts déplacent le poids vers l'avant — cette sangle garde la commode sûre."),
   need:[[L("Anti-tip restraint kit","Kit antivuelco","Kit anti-basculement"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"tighten", title:L("Drawers in and final alignment","Cajones adentro y alineación final","Tiroirs en place et alignement final"),
   text:L("Slide the drawers in top to bottom, checking each front sits flush and the gaps look even. Open one drawer at a time only, and re-check every cam lock to finish.","Mete los cajones de arriba abajo, revisando que cada frente quede a ras y los espacios parejos. Abre un solo cajón a la vez, y revisa cada leva para terminar.","Glissez les tiroirs de haut en bas, en vérifiant que chaque façade affleure et que les écarts sont réguliers. N'ouvrez qu'un tiroir à la fois, et revérifiez chaque came pour finir."),
   need:[[L("Assembled drawers","Cajones armados","Tiroirs assemblés"),"×6"]],
   tip:L("If one front sits proud, swap it with the drawer below before adjusting anything — fronts are sometimes a hair different.","Si un frente sobresale, cámbialo por el cajón de abajo antes de ajustar nada — los frentes a veces difieren un pelo.","Si une façade dépasse, échangez-la avec le tiroir du dessous avant tout réglage — les façades diffèrent parfois d'un cheveu.")},
 ]},

  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the top, bottom and fixed shelf. Seat cam locks in the side panels, arrows facing the dowel holes.","Atornilla los pernos en el panel superior, el inferior y la repisa fija. Asienta las levas en los laterales, con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans le panneau supérieur, l'inférieur et l'étagère fixe. Placez les cames dans les panneaux latéraux, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×10"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:0, title:L("Join the cabinet frame","Une el marco del armario","Joignez le cadre de l'armoire"),
   text:L("Connect the top, fixed shelf, bottom and base between the side panels, locking each cam as you go. Measure the diagonals before moving on — a tall cabinet shows every millimeter of error.","Une el panel superior, la repisa fija, el inferior y la base entre los laterales, bloqueando cada leva al avanzar. Mide las diagonales antes de seguir — un armario alto delata cada milímetro de error.","Reliez le panneau supérieur, l'étagère fixe, l'inférieur et la base entre les panneaux latéraux, en verrouillant chaque came. Mesurez les diagonales avant de continuer — une armoire haute révèle chaque millimètre d'erreur."),
   need:[[L("Top + bottom + fixed shelf + base","Superior + inferior + repisa fija + base","Supérieur + inférieur + étagère fixe + base"),"×4"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Nail on the back panel","Clava el panel trasero","Clouez le panneau arrière"),
   text:L("Center the back panel and nail around the perimeter every few inches. Keep nails angled slightly inward so none pokes through inside the cabinet.","Centra el panel trasero y clava por el perímetro cada pocos centímetros. Inclina los clavos ligeramente hacia adentro para que ninguno salga por dentro del armario.","Centrez le panneau arrière et clouez le périmètre tous les quelques centimètres. Inclinez les clous légèrement vers l'intérieur pour qu'aucun ne ressorte dans l'armoire."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×16"]], tool:L("Hammer","Martillo","Marteau")},
  {svg:"pole", title:L("Fit the garment rod and shelf","Coloca el tubo y la repisa","Posez la tringle et l'étagère"),
   text:L("Stand the cabinet up with two people. Screw the two rod sockets to the side panels at the same height, drop in the garment rod, then set the adjustable shelf on its four pins where you want it.","Paren el armario entre dos. Atornillen los dos soportes del tubo a los laterales a la misma altura, metan el tubo y luego coloquen la repisa ajustable sobre sus cuatro pernos donde la quieran.","Redressez l'armoire à deux. Vissez les deux supports de tringle aux panneaux latéraux à la même hauteur, posez la tringle, puis placez l'étagère réglable sur ses quatre taquets où vous la voulez."),
   need:[[L("Garment rod","Tubo para colgar","Tringle"),"×1"],[L("Rod socket","Soporte de tubo","Support de tringle"),"×2"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×1"],[L("Shelf pin","Perno de repisa","Taquet d'étagère"),"×4"],[L("Screw","Tornillo","Vis"),"×6"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"panels", title:L("Hang the two doors","Cuelga las dos puertas","Accrochez les deux portes"),
   text:L("Screw the hinges to the doors first, then to the cabinet sides. Hang one door at a time and adjust the hinge screws until both doors meet evenly in the middle with a consistent gap.","Atornilla las bisagras primero a las puertas y luego a los laterales del armario. Cuelga una puerta a la vez y ajusta los tornillos de las bisagras hasta que ambas se encuentren parejas al centro con un espacio constante.","Vissez les charnières d'abord aux portes, puis aux côtés de l'armoire. Accrochez une porte à la fois et réglez les vis des charnières jusqu'à ce que les deux portes se rejoignent régulièrement au centre avec un écart constant."),
   need:[[L("Door","Puerta","Porte"),"×2"],[L("Door hinge","Bisagra","Charnière"),"×4"],[L("Door handle + bolts","Manija + pernos","Poignée de porte + boulons"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("A door that swings open by itself means the cabinet leans — level it before fighting the hinges.","Una puerta que se abre sola significa que el armario está inclinado — nivélalo antes de pelear con las bisagras.","Une porte qui s'ouvre toute seule signifie que l'armoire penche — mettez-la de niveau avant de lutter avec les charnières.")},
  {svg:"anchor", title:L("Anchor to the wall","Anclaje a la pared","Ancrez au mur"),
   text:L("Fix the anchor strap to the top back of the cabinet and into a wall stud. A tall storage cabinet loaded with coats and boxes must never stand unanchored.","Fija la correa de anclaje a la parte trasera superior del armario y a un montante de la pared. Un armario alto cargado de abrigos y cajas nunca debe quedar sin anclar.","Fixez la sangle d'ancrage en haut à l'arrière de l'armoire et dans un montant du mur. Une armoire haute chargée de manteaux et de boîtes ne doit jamais rester sans ancrage."),
   need:[[L("Wall anchor strap","Correa de anclaje a pared","Sangle d'ancrage mural"),"×1"]], tool:L("Drill","Taladro","Perceuse")},
  {svg:"level", title:L("Level and final check","Nivela y revisión final","Niveau et contrôle final"),
   text:L("Confirm the cabinet stands plumb, open and close both doors three times, and re-check every cam lock. Load heavy boxes on the fixed shelf, light items up top.","Confirma que el armario quede a plomo, abre y cierra ambas puertas tres veces y revisa cada leva. Carga las cajas pesadas en la repisa fija y lo ligero arriba.","Confirmez l'aplomb de l'armoire, ouvrez et fermez les deux portes trois fois et revérifiez chaque came. Chargez les boîtes lourdes sur l'étagère fixe et les objets légers en haut."),
   need:[[L("Screw","Tornillo","Vis"),"×12"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
 ]},

{ id:"sau420287", store:"Wayfair", alsoAt:["Amazon","Walmart"], sku:"420287", anchor:false, brand:"Sauder",
 name:L("Sauder Carson Forge Coffee Table","Mesa de centro Sauder Carson Forge","Table basse Sauder Carson Forge"),
 blurb:L("Lift-top coffee table with hidden storage under the top and a lower shelf — work, eat and stash, all from the sofa.","Mesa de centro con tapa elevable, almacenamiento oculto bajo la tapa y repisa baja — trabaja, come y guarda, todo desde el sofá.","Table basse à plateau relevable avec rangement caché sous le plateau et étagère basse — travailler, manger et ranger, tout depuis le canapé."),
 time:L("~55 min","~55 min","~55 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 1.5 × 1.5 m of clear floor","Unos 1.5 × 1.5 m de piso libre","Environ 1,5 × 1,5 m de sol libre"), people:"1–2",
 parts:[[L("Lift top","Tapa elevable","Plateau relevable"),"×1"],[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("End panel","Panel de extremo","Panneau d'extrémité"),"×2"],[L("Apron rail","Riel del faldón","Rail de ceinture"),"×2"],[L("Lower shelf","Repisa baja","Étagère basse"),"×1"],[L("Storage floor","Piso del almacenamiento","Fond du rangement"),"×1"],[L("Leg","Pata","Pied"),"×4"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×12"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×24"],[L("Lift mechanism arm","Brazo del mecanismo elevable","Bras du mécanisme relevable"),"×2"],[L("Hinge","Bisagra","Charnière"),"×2"],[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]],
 tools:L("Phillips screwdriver and a second pair of hands to set the lift top.","Destornillador Phillips y un segundo par de manos para colocar la tapa elevable.","Tournevis Phillips et une deuxième paire de mains pour poser le plateau relevable."),
 surface:L("Build the base upside-down on a blanket. The lift mechanism has springs — keep fingers clear of the hinge points while it is unmounted.","Arma la base boca abajo sobre una cobija. El mecanismo elevable tiene resortes — mantén los dedos lejos de las bisagras mientras esté sin montar.","Montez la base à l'envers sur une couverture. Le mécanisme relevable a des ressorts — gardez les doigts loin des charnières tant qu'il n'est pas monté."),
 steps:[
  {svg:"unpack", title:L("Unpack and identify the top","Desempaca e identifica la tapa","Déballez et identifiez le plateau"),
   text:L("Lay out the body panels, the lower shelf and the four legs. Set the lift top aside face-down on the blanket — it goes on near the end, and its underside carries the mechanism mounts.","Acomoda los paneles del cuerpo, la repisa baja y las cuatro patas. Deja la tapa elevable aparte, boca abajo sobre la cobija — va casi al final, y su parte inferior lleva los montajes del mecanismo.","Disposez les panneaux du corps, l'étagère basse et les quatre pieds. Mettez le plateau relevable de côté, face vers le bas sur la couverture — il se pose vers la fin, et son dessous porte les fixations du mécanisme."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the side and end panels and the apron rails. Seat the cam locks where panels meet, arrows facing the incoming dowels.","Atornilla los pernos en los paneles laterales y de extremo y en los rieles del faldón. Asienta las levas donde se unen los paneles, con las flechas hacia los pernos entrantes.","Vissez les goujons dans les panneaux latéraux et d'extrémité et dans les rails de ceinture. Placez les cames aux jonctions, flèches vers les goujons entrants."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×12"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:1, title:L("Build the table body","Arma el cuerpo de la mesa","Assemblez le corps de la table"),
   text:L("Join the two side panels and two end panels into a box with the apron rails, locking each cam. Drop the storage floor into the bottom grooves so the hidden compartment has its base.","Une los dos paneles laterales y los dos de extremo formando una caja con los rieles del faldón, bloqueando cada leva. Mete el piso del almacenamiento en las ranuras inferiores para que el compartimento oculto tenga su base.","Joignez les deux panneaux latéraux et les deux d'extrémité en boîte avec les rails de ceinture, en verrouillant chaque came. Posez le fond du rangement dans les rainures du bas pour donner sa base au compartiment caché."),
   need:[[L("Side panel + end panel","Panel lateral + de extremo","Panneau latéral + d'extrémité"),"×4"],[L("Apron rail","Riel del faldón","Rail de ceinture"),"×2"],[L("Storage floor","Piso del almacenamiento","Fond du rangement"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"legs", arg:"table", title:L("Attach the four legs","Coloca las cuatro patas","Fixez les quatre pieds"),
   text:L("While the body is upside-down, screw one leg into each corner block until snug. Stick a felt pad on each foot now, while you can still see them.","Con el cuerpo boca abajo, atornilla una pata en cada bloque de esquina hasta que quede firme. Pega un fieltro en cada pie ahora, mientras aún puedes verlos.","Le corps à l'envers, vissez un pied dans chaque bloc de coin jusqu'à fermeté. Collez un patin en feutre sur chaque pied maintenant, tant qu'ils sont visibles."),
   need:[[L("Leg","Pata","Pied"),"×4"],[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"shelf", title:L("Fit the lower shelf","Coloca la repisa baja","Posez l'étagère basse"),
   text:L("Still upside-down, slide the lower shelf between the legs onto its supports and screw it down at the corners. This shelf braces the legs — do not skip its screws.","Aún boca abajo, desliza la repisa baja entre las patas sobre sus soportes y atorníllala en las esquinas. Esta repisa da rigidez a las patas — no saltes sus tornillos.","Toujours à l'envers, glissez l'étagère basse entre les pieds sur ses supports et vissez-la aux coins. Cette étagère rigidifie les pieds — ne sautez pas ses vis."),
   need:[[L("Lower shelf","Repisa baja","Étagère basse"),"×1"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"panels", title:L("Mount the lift mechanism arms","Monta los brazos del mecanismo","Montez les bras du mécanisme"),
   text:L("Turn the body upright with help. Screw one lift arm inside each side panel at the marked points, keeping fingers clear of the spring hinges. Both arms must sit at the same height and angle.","Voltea el cuerpo con ayuda. Atornilla un brazo elevable dentro de cada panel lateral en los puntos marcados, manteniendo los dedos lejos de las bisagras con resorte. Ambos brazos deben quedar a la misma altura y ángulo.","Redressez le corps à deux. Vissez un bras relevable à l'intérieur de chaque panneau latéral aux points marqués, doigts loin des charnières à ressort. Les deux bras doivent être à la même hauteur et au même angle."),
   need:[[L("Lift mechanism arm","Brazo del mecanismo elevable","Bras du mécanisme relevable"),"×2"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("If one arm sits higher, the top will lift crooked and strain both hinges — measure, do not eyeball.","Si un brazo queda más alto, la tapa se elevará chueca y forzará ambas bisagras — mide, no calcules a ojo.","Si un bras est plus haut, le plateau se lèvera de travers et forcera les deux charnières — mesurez, ne jugez pas à l'œil.")},
  {svg:"tighten", title:L("Set the lift top and test","Coloca la tapa y prueba","Posez le plateau et testez"),
   text:L("With two people, hold the lift top over the arms and screw it to the arm plates and rear hinges. Lower and raise it three times — it should move smoothly and stay up on its own.","Entre dos, sostengan la tapa sobre los brazos y atorníllenla a las placas de los brazos y a las bisagras traseras. Bájenla y súbanla tres veces — debe moverse suave y quedarse arriba sola.","À deux, tenez le plateau au-dessus des bras et vissez-le aux plaques des bras et aux charnières arrière. Abaissez-le et relevez-le trois fois — il doit bouger en douceur et tenir relevé tout seul."),
   need:[[L("Lift top","Tapa elevable","Plateau relevable"),"×1"],[L("Hinge","Bisagra","Charnière"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"level", title:L("Level and final check","Nivela y revisión final","Niveau et contrôle final"),
   text:L("Press each corner to test for rocking — a short leg gets one extra felt pad as a shim. Re-check every cam lock and put the remotes in the hidden compartment.","Presiona cada esquina para probar que no se tambalee — una pata corta se compensa con un fieltro extra. Revisa cada leva y guarda los controles en el compartimento oculto.","Pressez chaque coin pour tester la stabilité — un pied court se compense avec un patin en feutre supplémentaire. Revérifiez chaque came et rangez les télécommandes dans le compartiment caché."),
   need:[[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]]},
 ]},

{ id:"sau433713", store:"Walmart", alsoAt:["Amazon","Wayfair"], sku:"433713", anchor:false, brand:"Sauder",
 name:L("Sauder Granite Trace Side Table","Mesa auxiliar Sauder Granite Trace","Table d'appoint Sauder Granite Trace"),
 blurb:L("Compact end table with one drawer and a cabinet door — the Granite Trace finish pairs with the living-room set.","Mesa auxiliar compacta con un cajón y una puerta de gabinete — el acabado Granite Trace combina con el juego de sala.","Table d'appoint compacte avec un tiroir et une porte — la finition Granite Trace s'assortit à l'ensemble du salon."),
 time:L("~35 min","~35 min","~35 min"), diff:L("Easy","Fácil","Facile"),
 space:L("About 1 × 1 m of clear floor","Unos 1 × 1 m de piso libre","Environ 1 × 1 m de sol libre"), people:"1",
 parts:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Bottom panel","Panel inferior","Panneau inférieur"),"×1"],[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Door","Puerta","Porte"),"×1"],[L("Drawer front","Frente de cajón","Façade de tiroir"),"×1"],[L("Drawer side","Costado de cajón","Côté de tiroir"),"×2"],[L("Drawer back","Trasera de cajón","Dos de tiroir"),"×1"],[L("Drawer bottom","Fondo de cajón","Fond de tiroir"),"×1"]],
 hardware:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×8"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×16"],[L("Drawer glide set","Juego de correderas","Jeu de glissières"),"×1"],[L("Door hinge","Bisagra","Charnière"),"×2"],[L("Knob + bolt","Perilla + perno","Bouton + boulon"),"×2"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×10"]],
 tools:L("Phillips screwdriver and a hammer.","Destornillador Phillips y un martillo.","Tournevis Phillips et un marteau."),
 surface:L("Build on a blanket or rug. A small table tempts you to build it on the sofa — resist; cam locks need a flat, firm surface.","Ármala sobre una cobija o tapete. Una mesa pequeña tienta a armarla en el sofá — resiste; las levas necesitan una superficie plana y firme.","Montez-la sur une couverture ou un tapis. Une petite table donne envie de la monter sur le canapé — résistez ; les cames exigent une surface plane et ferme."),
 steps:[
  {svg:"unpack", title:L("Unpack and sort","Desempaca y ordena","Déballez et triez"),
   text:L("Lay out the top, sides, bottom, back, door and the drawer pieces. Group the eight cam sets and screws in a small pile.","Acomoda el panel superior, los laterales, el inferior, el trasero, la puerta y las piezas del cajón. Agrupa los ocho juegos de leva y los tornillos en un montoncito.","Disposez le panneau supérieur, les côtés, l'inférieur, l'arrière, la porte et les pièces du tiroir. Regroupez les huit jeux de cames et les vis en un petit tas."),
   need:[[L("All parts + hardware","Todas las piezas + tornillería","Toutes les pièces + quincaillerie"),"×1"]]},
  {svg:"cams", title:L("Fit cams and dowels","Coloca levas y pernos","Posez cames et goujons"),
   text:L("Screw cam dowels into the top and bottom panels. Seat the cam locks in the side panels with arrows toward the dowel holes.","Atornilla los pernos en los paneles superior e inferior. Asienta las levas en los laterales con las flechas hacia los agujeros de los pernos.","Vissez les goujons dans les panneaux supérieur et inférieur. Placez les cames dans les panneaux latéraux, flèches vers les trous des goujons."),
   need:[[L("Cam lock + dowel set","Juego de leva + perno","Jeu came + goujon"),"×8"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"frame", arg:0, title:L("Build the table body","Arma el cuerpo de la mesa","Assemblez le corps de la table"),
   text:L("Join the bottom panel between the side panels, then the top panel, turning each cam lock as you go. Check the front edges line up flush — the door gap depends on it.","Une el panel inferior entre los laterales y luego el superior, girando cada leva al avanzar. Revisa que los bordes frontales queden a ras — de eso depende el espacio de la puerta.","Joignez le panneau inférieur entre les côtés, puis le panneau supérieur, en tournant chaque came. Vérifiez que les bords avant affleurent — l'écart de la porte en dépend."),
   need:[[L("Top + bottom + side panels","Paneles superior + inferior + laterales","Panneaux supérieur + inférieur + latéraux"),"×4"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Nail on the back panel","Clava el panel trasero","Clouez le panneau arrière"),
   text:L("With the body face-down, center the back panel and nail around its edges. Square corners now mean a door that hangs straight later.","Con el cuerpo boca abajo, centra el panel trasero y clava por los bordes. Esquinas a escuadra ahora significan una puerta derecha después.","Le corps face vers le bas, centrez le panneau arrière et clouez ses bords. Des coins d'équerre maintenant signifient une porte droite plus tard."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Back-panel nail","Clavo del panel trasero","Clou du panneau arrière"),"×10"]], tool:L("Hammer","Martillo","Marteau")},
  {svg:"glides", title:L("Mount the drawer glides","Monta las correderas","Montez les glissières"),
   text:L("Turn the table upright. Separate the glide set and screw the cabinet halves to the inner sides at the marked height, level on both sides. Keep the drawer halves aside.","Para la mesa. Separa el juego de correderas y atornilla las mitades del mueble a los lados internos a la altura marcada, niveladas en ambos lados. Deja aparte las mitades del cajón.","Redressez la table. Séparez le jeu de glissières et vissez les moitiés côté meuble sur les côtés intérieurs à la hauteur marquée, de niveau des deux côtés. Gardez les moitiés tiroir de côté."),
   need:[[L("Drawer glide set","Juego de correderas","Jeu de glissières"),"×1"],[L("Wood screw","Tornillo para madera","Vis à bois"),"×6"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"drawer", title:L("Build the drawer and door","Arma el cajón y la puerta","Montez le tiroir et la porte"),
   text:L("Build the drawer box (sides, back, bottom), fix the front, and add the glide halves and one knob. Then screw the hinges to the door and the cabinet and hang the door, adjusting for an even gap.","Arma la caja del cajón (costados, trasera, fondo), fija el frente y agrega las mitades de corredera y una perilla. Luego atornilla las bisagras a la puerta y al mueble y cuelga la puerta, ajustando para un espacio parejo.","Montez la boîte du tiroir (côtés, dos, fond), fixez la façade, et ajoutez les moitiés de glissières et un bouton. Puis vissez les charnières à la porte et au meuble et accrochez la porte, en réglant pour un écart régulier."),
   need:[[L("Drawer pieces","Piezas del cajón","Pièces du tiroir"),"×5"],[L("Door","Puerta","Porte"),"×1"],[L("Door hinge","Bisagra","Charnière"),"×2"],[L("Knob + bolt","Perilla + perno","Bouton + boulon"),"×2"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"tighten", title:L("Slide in, final check","Mete el cajón y revisión final","Glissez le tiroir, contrôle final"),
   text:L("Slide the drawer in until both glides click, open and close it and the door three times, and re-check every cam lock. Done — lamp on top, book inside.","Desliza el cajón hasta que ambas correderas hagan clic, abre y cierra el cajón y la puerta tres veces, y revisa cada leva. Listo — lámpara arriba, libro adentro.","Glissez le tiroir jusqu'au clic des deux glissières, ouvrez et fermez le tiroir et la porte trois fois, et revérifiez chaque came. Terminé — lampe dessus, livre dedans."),
   need:[[L("Assembled drawer","Cajón armado","Tiroir assemblé"),"×1"]]},
 ]},
