<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AssembleWise</title>
<style>
  :root{
    --blue:#1558d6; --blue-dark:#0d3fa3; --accent:#ff8c1a;
    --bg:#f4f6fb; --card:#ffffff; --ink:#16213a; --muted:#6b7690;
    --ok:#1e9e5a; --warn:#b96a00; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.45;}
  header.top{position:sticky; top:0; z-index:10; background:linear-gradient(135deg,var(--blue),var(--blue-dark));
       color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px;
       box-shadow:0 2px 10px rgba(13,63,163,.25);}
  .logo{width:38px;height:38px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;
        font-size:22px;flex:0 0 auto;}
  .brand{flex:1;min-width:0;}
  .brand h1{margin:0;font-size:20px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand p{margin:0;font-size:12px;opacity:.85;}
  .iconbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;width:38px;height:38px;
        font-size:18px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;}
  .lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:12px;padding:6px 9px;border-radius:999px;cursor:pointer;}
  .lang button.on{background:#fff;color:var(--blue-dark);}
  main{max-width:560px;margin:0 auto;padding:16px 14px 90px;}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;
        box-shadow:0 1px 4px rgba(22,33,58,.08);}
  .search{display:flex;gap:8px;}
  .search input{flex:1;border:2px solid #dbe3f3;border-radius:12px;padding:12px;font-size:16px;outline:none;}
  .search input:focus{border-color:var(--blue);}
  .chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .chip{border:2px solid #dbe3f3;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
        color:var(--muted);cursor:pointer;}
  .chip.on{border-color:var(--blue);color:var(--blue);background:#eaf1fe;}
  .paste-tip{font-size:12px;color:var(--muted);margin:0 2px 12px;}
  .prod{cursor:pointer;transition:transform .08s;position:relative;}
  .prod:active{transform:scale(.985);}
  .prod h3{margin:0 0 4px;font-size:16px;padding-right:40px;}
  .favbtn{position:absolute;top:12px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:4px;}
  .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;background:#eaf1fe;color:var(--blue);
         border-radius:999px;padding:3px 10px;margin-bottom:8px;}
  .badge.done{background:#e8f7ee;color:var(--ok);}
  .badge.prog{background:#fff3e2;color:var(--warn);}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary:active{background:var(--blue-dark);}
  .btn.accent{background:var(--accent);color:#fff;}
  .btn.ghost{background:#eef2fa;color:var(--blue);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  h2.sec{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px;}
  ul.tidy{margin:0;padding:0;list-style:none;}
  ul.tidy li{padding:9px 0;border-bottom:1px solid #eef1f7;font-size:14px;display:flex;justify-content:space-between;gap:10px;}
  ul.tidy li:last-child{border-bottom:0;}
  .qty{color:var(--muted);white-space:nowrap;font-weight:700;}
  .note{background:#fff8ec;border:1px solid #ffe1b3;border-radius:12px;padding:12px;font-size:13px;color:#7a4a00;margin-top:12px;}
  .safety{background:#fdeeee;border:1px solid #f3c2c2;border-radius:12px;padding:12px;font-size:13px;color:#7a1f1f;margin-top:12px;}
  .footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;padding:0 10px;}
  /* guide */
  .progress{height:8px;background:#e3e9f6;border-radius:99px;overflow:hidden;margin:10px 0 4px;}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb35c);border-radius:99px;transition:width .3s;}
  .stepcount{font-size:12px;color:var(--muted);text-align:right;}
  .diagram{background:#f7f9ff;border:1px solid #e3e9f6;border-radius:12px;padding:8px;margin:10px 0;}
  .diagram svg{width:100%;height:auto;display:block;}
  .steptext{font-size:17px;margin:10px 0;}
  .tooline{font-size:14px;color:var(--blue-dark);background:#eaf1fe;border-radius:10px;padding:8px 12px;margin:8px 0;}
  .tiplabel{font-weight:800;color:var(--ok);font-size:13px;}
  .tiptext{font-size:14px;color:#2c3a55;}
  .narrate{margin:12px 0;}
  .narrate.playing{background:#e8f7ee;color:var(--ok);border:2px solid var(--ok);}
  .done-emoji{font-size:56px;text-align:center;}
  .hidden{display:none !important;}
  .backlink{background:none;border:0;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;padding:6px 0;}
  .version{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));right:10px;background:#16213a;color:#fff;
         font-size:10px;font-weight:700;padding:6px 10px;border-radius:999px;opacity:.85;z-index:20;}
  /* ads + premium */
  .adslot{border:2px dashed #c9d4ea;border-radius:12px;background:#eef2fa;color:var(--muted);
        text-align:center;padding:22px 12px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:14px;}
  .adslot small{display:block;font-weight:400;letter-spacing:0;margin-top:4px;text-transform:none;}
  .premium-banner{background:linear-gradient(135deg,#ffb35c,var(--accent));color:#fff;border-radius:var(--radius);
        padding:16px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 8px rgba(255,140,26,.35);}
  .premium-banner h3{margin:0 0 4px;font-size:16px;}
  .premium-banner p{margin:0;font-size:13px;opacity:.95;}
  /* modals */
  .overlay{position:fixed;inset:0;background:rgba(10,18,38,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
        max-height:88vh;overflow:auto;}
  .sheet h2{margin:0 0 10px;font-size:19px;}
  .sheet p{font-size:14px;color:#2c3a55;}
  .sheet label.lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.6px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;border:2px solid #dbe3f3;background:#fff;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;color:var(--muted);}
  .seg button.on{border-color:var(--blue);color:var(--blue);background:#eaf1fe;}
  input[type=range]{width:100%;accent-color:var(--blue);}
  .checklist{list-style:none;margin:12px 0;padding:0;text-align:left;}
  .checklist li{padding:10px 0;border-bottom:1px solid #eef1f7;font-size:14px;display:flex;gap:10px;align-items:flex-start;}
  .checklist li:last-child{border-bottom:0;}
  .checklist input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--ok);}
  /* animated schematic helpers */
  @keyframes pulseHL{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes slideIn{0%{transform:translateX(-14px);opacity:.2}60%{transform:translateX(2px);opacity:1}100%{transform:translateX(0);opacity:1}}
  @keyframes slideUp{0%{transform:translateY(14px);opacity:.2}100%{transform:translateY(0);opacity:1}}
  @keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes arrowMove{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* v1.1: video, resume card, scan */
  .stepvideo{width:100%;border-radius:12px;background:#0d1526;display:block;max-height:320px;}
  .videotag{font-size:12px;font-weight:700;color:var(--blue);margin:6px 2px 0;}
  .resume-card{border:2px solid var(--accent);background:linear-gradient(135deg,#fff6ea,#fff);cursor:pointer;}
  .resume-card h3{margin:0 0 4px;font-size:16px;}
  .scanbtn{margin:0 0 12px;background:var(--accent);color:#fff;font-size:17px;}
  .alsoat{font-size:12px;color:var(--muted);margin-top:6px;}
  .narrate-hint{font-size:14px;font-weight:700;color:var(--blue-dark);background:#eaf1fe;border-radius:10px;padding:10px 12px;margin:12px 0 0;}
  .narrate{font-size:17px;padding:17px;}
  .scanimg{width:100%;border-radius:12px;margin:10px 0;display:block;}
  .scanrow{display:flex;gap:8px;margin-top:10px;}
  .scanrow input{flex:1;border:2px solid #dbe3f3;border-radius:12px;padding:12px;font-size:15px;}
  .scanrow .btn{width:auto;padding:12px 18px;}

  /* ==========================================================
     v1.1 DESIGN PASS — minimalist, Apple-Store-style.
     Clean light surfaces, generous whitespace, ONE accent
     (#0071e3), quiet typography. Overrides only — every class
     and id from v1.0/v1.1 keeps working underneath.
     ========================================================== */
  :root{ --blue:#0071e3; --blue-dark:#0060c9; --accent:#0071e3;
         --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --radius:20px; }
  body{ -webkit-font-smoothing:antialiased; letter-spacing:-.01em; }
  header.top{ background:rgba(255,255,255,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
       color:var(--ink); box-shadow:none; border-bottom:1px solid #e6e6eb; }
  .logo{ background:#eef4fd; border-radius:12px; }
  .brand h1{ font-size:19px; font-weight:700; letter-spacing:-.02em; }
  .brand p{ color:var(--muted); opacity:1; }
  .iconbtn{ background:#f0f0f3; color:var(--ink); }
  .lang{ background:#f0f0f3; }
  .lang button{ color:var(--muted); }
  .lang button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.14); }
  main{ padding:22px 16px 90px; }
  .card{ border-radius:var(--radius); padding:20px; margin-bottom:16px;
         box-shadow:0 4px 24px rgba(0,0,0,.055); }
  .hero-card{ padding:26px 20px 18px; }
  .hero{ font-size:30px; font-weight:800; letter-spacing:-.03em; margin:0 0 16px; }
  .search input{ border:0; background:#e9e9ee; border-radius:14px; padding:16px 18px; font-size:17px; }
  .search input:focus{ background:#e3e9f4; box-shadow:0 0 0 3px rgba(0,113,227,.25); }
  .scanbtn{ background:#fff; color:var(--blue); border:1.5px solid var(--blue); border-radius:999px;
            font-weight:600; padding:13px; margin:14px 0 4px; }
  .paste-tip{ margin:10px 2px 4px; }
  .chips{ gap:8px; margin:14px 0 6px; }
  .chip{ border:0; background:#e9e9ee; color:#3a3a3c; border-radius:999px; padding:8px 15px; font-weight:500; }
  .chip.on{ background:var(--ink); color:#fff; }
  .prod{ padding:20px; }
  .prod h3{ font-size:17px; font-weight:600; letter-spacing:-.015em; }
  .badge{ background:#f5f5f7; color:var(--muted); font-weight:600; }
  .badge.done{ background:#e9f8ef; color:var(--ok); }
  .badge.prog{ background:#fdf1de; color:var(--warn); }
  .btn{ border-radius:999px; padding:14px 20px; font-weight:600; letter-spacing:-.01em; }
  .btn.ghost{ background:#e9e9ee; color:var(--blue); }
  .btn.primary:active{ background:var(--blue-dark); }
  h2.sec{ font-size:12px; letter-spacing:.06em; font-weight:600; }
  ul.tidy li{ border-bottom-color:#f0f0f3; padding:10px 0; }
  .note{ background:#fbfbfd; border-color:#e6e6eb; color:#515154; border-radius:14px; }
  .safety{ border-radius:14px; }
  .diagram{ background:#fbfbfd; border-color:#ececf0; border-radius:16px; padding:12px; }
  .progress{ height:6px; background:#e9e9ee; }
  .progress i{ background:var(--blue); }
  .tooline{ background:#f5f5f7; color:var(--ink); border-radius:12px; }
  .narrate-hint{ background:#f5f5f7; color:#3a3a3c; border-radius:12px; font-weight:500; }
  .adslot{ border:1.5px dashed #dcdce1; background:transparent; border-radius:16px; }
  .premium-banner{ background:#fff; color:var(--ink); border-radius:var(--radius);
        box-shadow:0 4px 24px rgba(0,0,0,.055); padding:20px; }
  .premium-banner h3{ color:var(--blue); font-size:17px; }
  .premium-banner p{ color:var(--muted); opacity:1; }
  .resume-card{ border:0; background:#fff; box-shadow:0 4px 24px rgba(0,113,227,.13); }
  .version{ background:rgba(29,29,31,.82); }
  .sheet{ border-radius:24px 24px 0 0; }
  .seg button{ border:0; background:#f0f0f3; color:var(--muted); border-radius:999px; }
  .seg button.on{ background:#fff; color:var(--ink); border-color:transparent; box-shadow:0 1px 4px rgba(0,0,0,.14); }
  .scanrow input{ border:0; background:#e9e9ee; border-radius:12px; }
  .stepvideo{ border-radius:16px; }
  .spotlight-card{ border:1.5px solid #dbe7fa; background:linear-gradient(180deg,#ffffff,#fbfdff); }
  .spotlight-title{ font-size:19px; font-weight:700; letter-spacing:-.02em; margin:0 0 4px; }
  .spotlight-sub{ font-size:13px; color:var(--muted); margin:0 0 8px; }
  .spotlight-note{ font-size:12px; color:var(--muted); margin:10px 0 0; }
  .spotlight-card .prod{ border:1px solid #f0f0f3; box-shadow:none; margin-bottom:10px; }
  .spotlight-card .prod:last-child{ margin-bottom:2px; }
  .hl{animation:pulseHL 1.6s ease-in-out infinite;}
  .slide-in{animation:slideIn 1.8s ease-in-out infinite;}
  .slide-up{animation:slideUp 1.8s ease-in-out infinite;}
  .spin-slow{animation:spinSlow 5s linear infinite;transform-origin:center;transform-box:fill-box;}
  .arrow-move{animation:arrowMove 1.4s ease-in-out infinite;}
  .bob{animation:bob 2.2s ease-in-out infinite;}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🛠️</div>
  <div class="brand"><h1 id="brand-name">AssembleWise</h1><p id="t-tagline"></p></div>
  <button class="iconbtn" id="btn-settings" aria-label="Settings">⚙️</button>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="en" class="on">EN</button><button data-l="es">ES</button><button data-l="fr">FR</button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="screen-home">
    <div class="card resume-card hidden" id="resume-card">
      <h3 id="resume-title"></h3>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;" id="resume-sub"></p>
      <button class="btn accent" id="resume-btn"></button>
    </div>
    <div class="card hero-card">
      <h2 class="hero" id="t-hero"></h2>
      <div class="search"><input id="q" type="search" autocomplete="off"></div>
      <button class="btn scanbtn" id="btn-scan"></button>
      <p class="paste-tip" id="t-pastetip"></p>
      <div class="chips" id="stores"></div>
      <div id="results"></div>
    </div>
    <div class="card spotlight-card" id="spotlight-card">
      <h3 class="spotlight-title" id="t-spotlight-title"></h3>
      <p class="spotlight-sub" id="t-spotlight-sub"></p>
      <div id="spotlight-results"></div>
      <p class="spotlight-note" id="t-spotlight-note"></p>
    </div>
    <div class="premium-banner hidden" id="premium-banner">
      <h3 id="t-premiumtitle"></h3><p id="t-premiumtext"></p>
    </div>
    <div class="adslot" id="ad-home"><span data-ad></span><small data-adsub></small></div>
  </section>

  <!-- PRODUCT -->
  <section id="screen-product" class="hidden">
    <button class="backlink" id="p-back">←</button>
    <div class="card">
      <span class="badge" id="p-store"></span>
      <h2 id="p-name" style="margin:4px 0 2px;"></h2>
      <div class="meta" id="p-meta"></div>
      <p id="p-blurb" style="color:var(--muted);font-size:14px;"></p>
      <p class="alsoat hidden" id="p-alsoat"></p>
      <div class="note hidden" id="p-resumenote"></div>
      <button class="btn ghost" id="p-fav" style="margin-top:6px;"></button>
      <h2 class="sec" id="t-prep"></h2>
      <ul class="tidy" id="p-prep"></ul>
      <h2 class="sec" id="t-parts"></h2><ul class="tidy" id="p-parts"></ul>
      <h2 class="sec" id="t-hardware"></h2><ul class="tidy" id="p-hw"></ul>
      <h2 class="sec" id="t-tools"></h2><p id="p-tools" style="font-size:14px;"></p>
      <div class="note" id="p-surface"></div>
      <div class="safety hidden" id="p-anchor"></div>
      <div style="margin-top:14px;"><button class="btn primary" id="p-start"></button></div>
      <div style="margin-top:8px;"><button class="btn ghost hidden" id="p-reset"></button></div>
    </div>
    <div class="adslot" id="ad-product"><span data-ad></span><small data-adsub></small></div>
  </section>

  <!-- GUIDE -->
  <section id="screen-guide" class="hidden">
    <button class="backlink" id="g-back">←</button>
    <div class="card">
      <div class="stepcount" id="g-count"></div>
      <div class="progress"><i id="g-bar"></i></div>
      <h2 id="g-title" style="margin:8px 0 2px;"></h2>
      <div id="g-video-wrap" class="hidden">
        <video class="stepvideo" id="g-video" controls playsinline preload="metadata"></video>
        <p class="videotag" id="g-videotag"></p>
      </div>
      <div class="diagram" id="g-svg"></div>
      <p class="steptext" id="g-text"></p>
      <div class="tooline hidden" id="g-tool"></div>
      <h2 class="sec" id="t-needparts"></h2><ul class="tidy" id="g-parts"></ul>
      <div id="g-tipwrap" style="margin-top:10px;"><span class="tiplabel" id="t-tiplabel"></span>
        <p class="tiptext" id="g-tip" style="margin:4px 0 0;"></p></div>
      <p class="narrate-hint" id="t-narratehint"></p>
      <button class="btn primary narrate" id="g-say"></button>
      <div class="btn-row">
        <button class="btn ghost" id="g-prev"></button>
        <button class="btn accent" id="g-next"></button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="hidden">
    <div class="card" style="text-align:center;">
      <div class="done-emoji">🎉</div>
      <h2 id="t-donetitle"></h2>
      <p id="d-sub" style="color:var(--muted);margin:4px 0 0;"></p>
      <h2 class="sec" id="t-finalcheck" style="text-align:left;"></h2>
      <ul class="checklist" id="d-checklist"></ul>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn ghost" id="d-restart"></button>
        <button class="btn primary" id="d-home"></button>
      </div>
    </div>
    <div class="adslot" id="ad-done"><span data-ad></span><small data-adsub></small></div>
  </section>

  <p class="footer-note" id="t-verify"></p>
</main>


<!-- SCAN MANUAL (v1.1) -->
<div class="overlay hidden" id="ov-scan">
  <div class="sheet">
    <h2 id="t-scantitle"></h2>
    <p id="t-scanintro"></p>
    <input type="file" id="scan-file" accept="image/*" capture="environment" class="hidden">
    <button class="btn accent" id="scan-pick"></button>
    <img class="scanimg hidden" id="scan-img" alt="manual photo">
    <div class="note" id="t-scandemo"></div>
    <div class="scanrow">
      <input id="scan-sku" type="text" autocomplete="off">
      <button class="btn primary" id="scan-find"></button>
    </div>
    <div id="scan-result" style="margin-top:12px;"></div>
    <div style="margin-top:16px;"><button class="btn ghost" id="scan-close"></button></div>
  </div>
</div>

<!-- SETTINGS -->
<div class="overlay hidden" id="ov-settings">
  <div class="sheet">
    <h2 id="t-settings"></h2>
    <label class="lab" id="t-setlang"></label>
    <div class="seg" id="set-lang">
      <button data-l="en">English</button><button data-l="es">Español</button><button data-l="fr">Français</button>
    </div>
    <label class="lab" id="t-setspeed"></label>
    <input type="range" id="set-rate" min="0.7" max="1.5" step="0.05" value="1">
    <p style="text-align:center;margin:6px 0 0;"><span id="rate-val"></span></p>
    <label class="lab" id="t-setpremium"></label>
    <p id="set-premium-state" style="margin:0 0 10px;"></p>
    <button class="btn primary" id="set-gopremium"></button>
    <div style="margin-top:16px;"><button class="btn ghost" id="set-close"></button></div>

   text:L("Fix the back modesty panel between the leg frames with the remaining bolts. Flip the desk upright, then slide the drawer onto its glides until both sides click.","Fija el panel trasero entre las estructuras de patas con los pernos restantes. Voltea el escritorio y desliza el cajón sobre sus correderas hasta que ambos lados hagan clic.","Fixez le panneau arrière entre les cadres de pieds avec les boulons restants. Retournez le bureau, puis glissez le tiroir sur ses glissières jusqu'au clic des deux côtés."),
   need:[[L("Back modesty panel","Panel trasero","Panneau arrière"),"×1"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"level", title:L("Final tighten and felt pads","Apriete final y fieltros","Serrage final et patins"),
   text:L("Fully tighten every bolt, stick a felt pad under each foot, and slide the drawer in and out three times — it should glide silently and stop straight.","Aprieta a fondo cada perno, pega un fieltro bajo cada pata y mete y saca el cajón tres veces — debe deslizarse en silencio y cerrar derecho.","Serrez à fond chaque boulon, collez un patin sous chaque pied et faites glisser le tiroir trois fois — il doit coulisser en silence et fermer droit."),
   need:[[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]],
   tip:L("If the drawer drifts open on its own, the desk is on a slope — the felt pads can shim one foot.","Si el cajón se abre solo, el escritorio está en una pendiente — los fieltros pueden nivelar una pata.","Si le tiroir s'ouvre tout seul, le bureau est en pente — les patins peuvent caler un pied.")}
 ]},

{ id:"tpct3310", store:"Wayfair", sku:"TPCT3310", anchor:false,
 name:L("Three Posts Farmhouse Coffee Table","Mesa de centro rústica Three Posts","Table basse rustique Three Posts"),
 blurb:L("Solid-wood-look coffee table with a lower storage shelf.","Mesa de centro con acabado de madera maciza y repisa inferior.","Table basse style bois massif avec étagère inférieure."),
 time:L("~30 min","~30 min","~30 min"), diff:L("Easy","Fácil","Facile"),
 space:L("About 1.5 × 1.5 m of clear floor","Unos 1.5 × 1.5 m de piso libre","Environ 1,5 × 1,5 m de sol libre"), people:"1",
 parts:[[L("Tabletop","Cubierta de la mesa","Plateau de la table"),"×1"],[L("Leg","Pata","Pied"),"×4"],[L("Side apron","Faldón lateral","Tablier latéral"),"×2"],[L("End apron","Faldón de extremo","Tablier d'extrémité"),"×2"],[L("Lower shelf","Repisa inferior","Étagère inférieure"),"×1"]],
 hardware:[[L("Hex bolt M6×50mm","Perno hex M6×50mm","Boulon hex M6×50mm"),"×12"],[L("Corner brace","Escuadra de esquina","Équerre de coin"),"×4"],[L("Wood screw 4×20mm","Tornillo para madera 4×20mm","Vis à bois 4×20mm"),"×16"],[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"],[L("Allen wrench (included)","Llave Allen (incluida)","Clé Allen (incluse)"),"×1"]],
 tools:L("Allen wrench (included) and a Phillips screwdriver.","Llave Allen (incluida) y un destornillador Phillips.","Clé Allen (incluse) et un tournevis Phillips."),
 surface:L("Assemble upside down on carpet. Wood-look corners chip if the table is dragged — always lift it.","Arma boca abajo sobre una alfombra. Las esquinas con acabado madera se astillan si arrastras la mesa — siempre levántala.","Assemblez à l'envers sur un tapis. Les coins style bois s'ébrèchent si on traîne la table — soulevez-la toujours."),
 steps:[
  {svg:"unpack", title:L("Unpack and identify the legs","Desempaca e identifica las patas","Déballez et identifiez les pieds"),
   text:L("Set the tabletop face-down. Check the four legs: two have shelf grooves facing one way, two the other — sort them into left and right pairs.","Pon la cubierta boca abajo. Revisa las cuatro patas: dos tienen la ranura de la repisa hacia un lado y dos hacia el otro — sepáralas en pares izquierdo y derecho.","Posez le plateau face vers le bas. Vérifiez les quatre pieds : deux ont la rainure d'étagère dans un sens, deux dans l'autre — triez-les en paires gauche et droite."),
   need:[[L("Tabletop","Cubierta de la mesa","Plateau de la table"),"×1"],[L("Leg","Pata","Pied"),"×4"]],
   tip:L("A leg with its groove facing out cannot hold the shelf later — sorting now saves a full redo.","Una pata con la ranura hacia afuera no puede sostener la repisa después — ordenar ahora evita rehacer todo.","Un pied avec la rainure vers l'extérieur ne pourra pas tenir l'étagère — le tri maintenant évite de tout refaire.")},
  {svg:"frame", arg:1, title:L("Bolt legs and aprons together","Une patas y faldones con pernos","Assemblez pieds et tabliers"),
   text:L("Connect the legs with the two side aprons and two end aprons using 8 hex bolts. Keep every bolt two turns loose so the frame can still flex.","Conecta las patas con los dos faldones laterales y los dos de extremo usando 8 pernos hex. Deja cada perno dos vueltas flojo para que la estructura aún pueda flexionarse.","Reliez les pieds avec les deux tabliers latéraux et les deux d'extrémité à l'aide de 8 boulons hex. Laissez chaque boulon desserré de deux tours pour que le cadre reste souple."),
   need:[[L("Side apron","Faldón lateral","Tablier latéral"),"×2"],[L("End apron","Faldón de extremo","Tablier d'extrémité"),"×2"],[L("Hex bolt M6×50mm","Perno hex M6×50mm","Boulon hex M6×50mm"),"×8"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"shelf", title:L("Drop in the lower shelf","Coloca la repisa inferior","Posez l'étagère inférieure"),
   text:L("Slide the lower shelf into the grooves on all four legs. If a corner resists, loosen that leg's bolts half a turn — never force the shelf.","Desliza la repisa inferior en las ranuras de las cuatro patas. Si una esquina se resiste, afloja los pernos de esa pata media vuelta — nunca fuerces la repisa.","Glissez l'étagère inférieure dans les rainures des quatre pieds. Si un coin résiste, desserrez les boulons de ce pied d'un demi-tour — ne forcez jamais l'étagère."),
   need:[[L("Lower shelf","Repisa inferior","Étagère inférieure"),"×1"]],
   tip:L("The shelf also squares the frame — if it drops in flat, your corners are already true.","La repisa también escuadra la estructura — si entra plana, tus esquinas ya están derechas.","L'étagère met aussi le cadre d'équerre — si elle entre à plat, vos coins sont déjà justes.")},
  {svg:"screw", title:L("Set the frame on the tabletop","Fija la estructura a la cubierta","Fixez le cadre au plateau"),
   text:L("Center the frame on the underside of the tabletop and drive the 4 corner braces with 16 wood screws, one brace inside each corner.","Centra la estructura en la parte inferior de la cubierta y fija las 4 escuadras de esquina con 16 tornillos para madera, una escuadra dentro de cada esquina.","Centrez le cadre sous le plateau et vissez les 4 équerres de coin avec 16 vis à bois, une équerre dans chaque coin."),
   need:[[L("Corner brace","Escuadra de esquina","Équerre de coin"),"×4"],[L("Wood screw 4×20mm","Tornillo para madera 4×20mm","Vis à bois 4×20mm"),"×16"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"tighten", title:L("Tighten every bolt","Aprieta todos los pernos","Serrez tous les boulons"),
   text:L("Go around the frame and fully tighten the 8 apron bolts plus the 4 remaining top bolts. Work corner to corner, not in a circle, so the frame pulls down evenly.","Recorre la estructura y aprieta a fondo los 8 pernos de los faldones más los 4 pernos superiores restantes. Trabaja de esquina a esquina, no en círculo, para que la estructura baje parejo.","Faites le tour du cadre et serrez à fond les 8 boulons des tabliers plus les 4 boulons supérieurs restants. Travaillez de coin en coin, pas en cercle, pour que le cadre descende uniformément."),
   need:[[L("Hex bolt M6×50mm","Perno hex M6×50mm","Boulon hex M6×50mm"),"×4"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"level", title:L("Flip it upright and add the pads","Voltéala y pon los fieltros","Retournez-la et posez les patins"),
   text:L("Flip the table upright — with a partner if needed — set it where it will live, and stick a felt pad under each leg. Press down on each corner: it should sit flat with no rock.","Voltea la mesa — con ayuda si la necesitas — ponla donde va a quedar y pega un fieltro bajo cada pata. Presiona cada esquina: debe quedar plana y sin tambalearse.","Retournez la table — à deux si besoin — placez-la à son emplacement et collez un patin sous chaque pied. Pressez chaque coin : elle doit être plane, sans vaciller."),
   need:[[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]],
   tip:L("Rocking on a hard floor usually means one brace screw is not fully home — check the corners before shimming a leg.","Un tambaleo en piso duro suele significar que un tornillo de escuadra no entró completo — revisa las esquinas antes de calzar una pata.","Un vacillement sur sol dur signifie souvent qu'une vis d'équerre n'est pas à fond — vérifiez les coins avant de caler un pied.")}
 ]},
/* ---------- 4 · IKEA KALLAX 2x2 ---------- */
{ id:"kallax22", store:"IKEA", sku:"80275887", anchor:true,
 name:L("KALLAX Shelf Unit 2×2","Estantería KALLAX 2×2","Étagère KALLAX 2×2"),
 blurb:L("Four-cube shelf unit that stands upright or on its side.","Estantería de cuatro cubos que va de pie o de lado.","Étagère à quatre cases, debout ou sur le côté."),
 time:L("~30 min","~30 min","~30 min"), diff:L("Easy","Fácil","Facile"),
 space:L("About 1.5 × 1.5 m of clear floor","Unos 1.5 × 1.5 m de piso libre","Environ 1,5 × 1,5 m de sol libre"), people:"1–2",
 parts:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Bottom panel","Panel inferior","Panneau inférieur"),"×1"],[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Center divider (long)","Divisor central (largo)","Séparateur central (long)"),"×1"],[L("Inner shelf (short)","Repisa interna (corta)","Étagère interne (courte)"),"×2"]],
 hardware:[[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×16"],[L("Hex screw","Tornillo hex","Vis hex"),"×8"],[L("Wall strap + screw","Correa de pared + tornillo","Sangle murale + vis"),"×1"],[L("Allen wrench (included)","Llave Allen (incluida)","Clé Allen (incluse)"),"×1"]],
 tools:L("Allen wrench (included), a mallet or hammer with a cloth, and a drill for the wall anchor.","Llave Allen (incluida), un mazo o martillo con un trapo, y un taladro para el anclaje a la pared.","Clé Allen (incluse), un maillet ou marteau avec un chiffon, et une perceuse pour l'ancrage mural."),
 surface:L("Panels are hollow-core and light — tap dowels in gently. The unit works standing or lying down, but it must be anchored to the wall either way.","Los paneles son huecos y ligeros — mete los tarugos con golpes suaves. La unidad va de pie o acostada, pero debe anclarse a la pared de cualquier modo.","Les panneaux sont creux et légers — enfoncez les chevilles doucement. Le meuble va debout ou couché, mais doit être ancré au mur dans les deux cas."),
 steps:[
  {svg:"sort", title:L("Sort panels and dowels","Ordena paneles y tarugos","Triez panneaux et chevilles"),
   text:L("Identify the thicker top and bottom panels, the two side panels, the long divider and the two short inner shelves. Count 16 wooden dowels.","Identifica los paneles gruesos superior e inferior, los dos paneles laterales, el divisor largo y las dos repisas cortas. Cuenta 16 tarugos de madera.","Identifiez les panneaux épais du haut et du bas, les deux panneaux latéraux, le long séparateur et les deux courtes étagères. Comptez 16 chevilles en bois."),
   need:[[L("All panels","Todos los paneles","Tous les panneaux"),"×7"],[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×16"]],
   tip:L("Top and bottom panels are noticeably thicker than the rest — that is how you tell them apart.","Los paneles superior e inferior son notablemente más gruesos que el resto — así los distingues.","Les panneaux du haut et du bas sont nettement plus épais que les autres — c'est ainsi qu'on les reconnaît.")},
  {svg:"panels", title:L("Dowel the side panels","Pon tarugos en los paneles laterales","Chevillez les panneaux latéraux"),
   text:L("Push 4 dowels into the edge holes of each side panel, tapping gently with the mallet. Dowels should sit about half in, half out.","Mete 4 tarugos en los agujeros del borde de cada panel lateral, golpeando suave con el mazo. Los tarugos deben quedar mitad adentro, mitad afuera.","Enfoncez 4 chevilles dans les trous de bord de chaque panneau latéral, en tapotant doucement au maillet. Les chevilles doivent dépasser à moitié."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×8"]], tool:L("Mallet","Mazo","Maillet")},
  {svg:"frame", arg:3, title:L("Join top and bottom","Une el panel superior e inferior","Assemblez haut et bas"),
   text:L("Press the top panel onto one side panel's dowels, then the bottom panel, then close the frame with the second side panel. Lock each corner with 2 hex screws.","Presiona el panel superior sobre los tarugos de un panel lateral, luego el inferior, y cierra la estructura con el segundo panel lateral. Fija cada esquina con 2 tornillos hex.","Pressez le panneau supérieur sur les chevilles d'un panneau latéral, puis le panneau inférieur, et fermez le cadre avec le second panneau latéral. Bloquez chaque coin avec 2 vis hex."),
   need:[[L("Top + bottom panels","Paneles superior e inferior","Panneaux haut et bas"),"×2"],[L("Hex screw","Tornillo hex","Vis hex"),"×8"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"shelf", title:L("Fit the long center divider","Coloca el divisor central largo","Posez le long séparateur central"),
   text:L("Slide the long divider into the middle slots so it crosses the unit top to bottom, seating it on its dowels. It should sit flush with both outer panels.","Desliza el divisor largo en las ranuras centrales para que cruce la unidad de arriba a abajo, asentándolo en sus tarugos. Debe quedar a ras con ambos paneles exteriores.","Glissez le long séparateur dans les fentes centrales pour traverser le meuble de haut en bas, bien assis sur ses chevilles. Il doit affleurer les deux panneaux extérieurs."),
   need:[[L("Center divider (long)","Divisor central (largo)","Séparateur central (long)"),"×1"],[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×4"]],
   tip:L("If the divider rocks, a dowel is not fully seated — tap the panel, not the divider.","Si el divisor se mueve, un tarugo no entró completo — golpea el panel, no el divisor.","Si le séparateur bouge, une cheville n'est pas bien enfoncée — tapez le panneau, pas le séparateur.")},
  {svg:"shelf", title:L("Add the two inner shelves","Pon las dos repisas internas","Ajoutez les deux étagères internes"),
   text:L("Slide one short inner shelf into each half of the divider, left and right, on the remaining dowels. You now have four equal cubes.","Desliza una repisa corta en cada mitad del divisor, izquierda y derecha, sobre los tarugos restantes. Ya tienes cuatro cubos iguales.","Glissez une courte étagère dans chaque moitié du séparateur, gauche et droite, sur les chevilles restantes. Vous avez maintenant quatre cases égales."),
   need:[[L("Inner shelf (short)","Repisa interna (corta)","Étagère interne (courte)"),"×2"],[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×4"]]},
  {svg:"anchor", title:L("Anchor it to the wall","Anclala a la pared","Ancrez-la au mur"),
   text:L("Stand the unit where it will live. Fix the included strap to the top of the unit and screw the other end into a wall stud or a proper wall anchor. This step prevents tip-over — never skip it.","Pon la unidad de pie donde va a quedar. Fija la correa incluida a la parte superior de la unidad y atornilla el otro extremo a un montante de la pared o a un taquete adecuado. Este paso evita que se vuelque — nunca lo saltes.","Placez le meuble debout à son emplacement. Fixez la sangle incluse au haut du meuble et vissez l'autre bout dans un montant du mur ou une cheville adaptée. Cette étape empêche le basculement — ne la sautez jamais."),
   need:[[L("Wall strap + screw","Correa de pared + tornillo","Sangle murale + vis"),"×1"]], tool:L("Drill + screwdriver","Taladro + destornillador","Perceuse + tournevis")},
  {svg:"level", title:L("Final check","Revisión final","Vérification finale"),
   text:L("Re-tighten all 8 hex screws, confirm the four cubes are square, and rock the unit gently — the strap should hold it with no forward give.","Vuelve a apretar los 8 tornillos hex, confirma que los cuatro cubos estén a escuadra y mece la unidad con suavidad — la correa debe sostenerla sin que se incline hacia adelante.","Resserrez les 8 vis hex, vérifiez que les quatre cases sont d'équerre et balancez doucement le meuble — la sangle doit le retenir sans jeu vers l'avant."),
   need:[[L("Allen wrench","Llave Allen","Clé Allen"),"×1"]], tool:L("Allen wrench","Llave Allen","Clé Allen")}
 ]},

/* ---------- 5 · IKEA BILLY bookcase ---------- */
{ id:"billy80", store:"IKEA", sku:"BILLY8040", anchor:true,
 name:L("BILLY Bookcase","Librero BILLY","Bibliothèque BILLY"),
 blurb:L("Classic tall bookcase with three fixed and two adjustable shelves.","Librero alto clásico con tres repisas fijas y dos ajustables.","Bibliothèque haute classique avec trois étagères fixes et deux réglables."),
 time:L("~40 min","~40 min","~40 min"), diff:L("Medium","Media","Moyenne"),
 space:L("About 2 × 1.5 m — it is built lying down","Unos 2 × 1.5 m — se arma acostado","Environ 2 × 1,5 m — elle se monte couchée"), people:"2",
 parts:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Bottom panel / plinth","Panel inferior / zócalo","Panneau inférieur / plinthe"),"×1"],[L("Fixed shelf","Repisa fija","Étagère fixe"),"×3"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×2"],[L("Back panel (folding)","Panel trasero (plegable)","Panneau arrière (pliant)"),"×1"]],
 hardware:[[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×12"],[L("Cam lock + stud","Excéntrica + perno","Excentrique + goujon"),"×8"],[L("Shelf support pin","Soporte de repisa","Taquet d'étagère"),"×8"],[L("Panel nail","Clavo para panel","Clou pour panneau"),"×24"],[L("Wall strap + screw","Correa de pared + tornillo","Sangle murale + vis"),"×1"]],
 tools:L("Hammer, Phillips screwdriver, and a drill for the wall anchor.","Martillo, destornillador Phillips y un taladro para el anclaje a la pared.","Marteau, tournevis Phillips et une perceuse pour l'ancrage mural."),
 surface:L("Build it face-down on carpet — the case is long and awkward. You will need a second person to stand it up safely.","Ármalo boca abajo sobre una alfombra — la estructura es larga e incómoda. Necesitarás una segunda persona para ponerlo de pie con seguridad.","Assemblez-la face vers le bas sur un tapis — la structure est longue et encombrante. Il faudra être deux pour la relever en sécurité."),
 steps:[
  {svg:"sort", title:L("Sort the case parts","Ordena las piezas de la estructura","Triez les pièces de la structure"),
   text:L("Lay both side panels parallel, grooves facing each other. Separate the three fixed shelves from the two adjustable ones — fixed shelves have cam holes at the ends.","Pon los dos paneles laterales paralelos, con las ranuras enfrentadas. Separa las tres repisas fijas de las dos ajustables — las fijas tienen agujeros de excéntrica en los extremos.","Posez les deux panneaux latéraux en parallèle, rainures face à face. Séparez les trois étagères fixes des deux réglables — les fixes ont des trous d'excentrique aux extrémités."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Fixed shelf","Repisa fija","Étagère fixe"),"×3"],[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×2"]],
   tip:L("The back-panel groove must run unbroken along both sides — if a panel is flipped, the back will not slide in later.","La ranura del panel trasero debe correr sin interrupción por ambos lados — si un panel está volteado, el fondo no entrará después.","La rainure du panneau arrière doit courir sans interruption des deux côtés — si un panneau est inversé, le fond n'entrera pas ensuite.")},
  {svg:"panels", title:L("Dowel and stud one side panel","Tarugos y pernos en un panel lateral","Chevilles et goujons sur un panneau latéral"),
   text:L("Push the 12 wooden dowels into the side panel's shelf holes and screw in the 8 cam studs by hand until they stop. Repeat the pattern mirrored on the second panel only where the fixed shelves land.","Mete los 12 tarugos en los agujeros de repisa del panel lateral y enrosca a mano los 8 pernos de excéntrica hasta que topen. Repite el patrón en espejo en el segundo panel solo donde van las repisas fijas.","Enfoncez les 12 chevilles dans les trous d'étagère du panneau latéral et vissez à la main les 8 goujons d'excentrique jusqu'à l'arrêt. Répétez en miroir sur le second panneau uniquement là où vont les étagères fixes."),
   need:[[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×12"],[L("Cam lock + stud","Excéntrica + perno","Excentrique + goujon"),"×8"]], tool:L("Your hands + screwdriver","Tus manos + destornillador","Vos mains + tournevis")},
  {svg:"frame", arg:0, title:L("Raise the fixed shelves","Levanta las repisas fijas","Montez les étagères fixes"),
   text:L("Set the three fixed shelves onto the dowels and studs of the first side panel: top, middle and bottom positions. Press each one down evenly with both palms.","Coloca las tres repisas fijas sobre los tarugos y pernos del primer panel lateral: posiciones superior, media e inferior. Presiona cada una parejo con ambas palmas.","Posez les trois étagères fixes sur les chevilles et goujons du premier panneau latéral : positions haute, moyenne et basse. Pressez chacune uniformément avec les deux paumes."),
   need:[[L("Fixed shelf","Repisa fija","Étagère fixe"),"×3"]]},
  {svg:"cams", title:L("Close the case and lock the cams","Cierra la estructura y bloquea las excéntricas","Fermez la structure et bloquez les excentriques"),
   text:L("Lower the second side panel onto the shelves, aligning every stud. Fit the top and bottom panels, then turn each cam lock clockwise with the screwdriver until it grips — about half a turn.","Baja el segundo panel lateral sobre las repisas, alineando cada perno. Coloca los paneles superior e inferior y gira cada excéntrica en sentido horario con el destornillador hasta que agarre — media vuelta aproximadamente.","Abaissez le second panneau latéral sur les étagères en alignant chaque goujon. Posez les panneaux du haut et du bas, puis tournez chaque excentrique dans le sens horaire avec le tournevis jusqu'à ce qu'elle morde — environ un demi-tour."),
   need:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Bottom panel / plinth","Panel inferior / zócalo","Panneau inférieur / plinthe"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),
   tip:L("A cam that spins freely means its stud is not through the hole — lift, reseat, and try again rather than forcing it.","Una excéntrica que gira libre significa que su perno no pasó por el agujero — levanta, reacomoda e inténtalo de nuevo en vez de forzarla.","Un excentrique qui tourne librement signifie que son goujon n'est pas dans le trou — soulevez, repositionnez et réessayez au lieu de forcer.")},
  {svg:"back", title:L("Nail on the back panel","Clava el panel trasero","Clouez le panneau arrière"),
   text:L("Unfold the back panel into the rear groove. Square the case by measuring both diagonals — they must match — then nail around the edge every 15 cm or so.","Despliega el panel trasero en la ranura posterior. Escuadra la estructura midiendo ambas diagonales — deben ser iguales — y clava por todo el borde cada 15 cm aproximadamente.","Dépliez le panneau arrière dans la rainure arrière. Mettez la structure d'équerre en mesurant les deux diagonales — elles doivent être égales — puis clouez tout le bord tous les 15 cm environ."),
   need:[[L("Back panel (folding)","Panel trasero (plegable)","Panneau arrière (pliant)"),"×1"],[L("Panel nail","Clavo para panel","Clou pour panneau"),"×24"]], tool:L("Hammer","Martillo","Marteau"),
   tip:L("The back is what keeps a bookcase from racking sideways — skipped nails today become a wobble next month.","El panel trasero es lo que evita que el librero se ladée — los clavos que saltes hoy serán un tambaleo el próximo mes.","Le panneau arrière empêche la bibliothèque de se voiler — les clous sautés aujourd'hui deviendront un vacillement le mois prochain.")},
  {svg:"anchor", title:L("Stand it up and anchor to the wall","Ponlo de pie y anclalo a la pared","Relevez-la et ancrez-la au mur"),
   text:L("With a partner, stand the bookcase upright and move it into place. Attach the wall strap at the top and screw it into a stud or proper anchor. Tall bookcases are a classic tip-over risk — this step is mandatory.","Con ayuda, pon el librero de pie y muévelo a su lugar. Fija la correa de pared en la parte superior y atorníllala a un montante o a un taquete adecuado. Los libreros altos son un riesgo clásico de vuelco — este paso es obligatorio.","À deux, relevez la bibliothèque et mettez-la en place. Fixez la sangle murale au sommet et vissez-la dans un montant ou une cheville adaptée. Les bibliothèques hautes sont un risque classique de basculement — cette étape est obligatoire."),
   need:[[L("Wall strap + screw","Correa de pared + tornillo","Sangle murale + vis"),"×1"]], tool:L("Drill + screwdriver","Taladro + destornillador","Perceuse + tournevis")},
  {svg:"shelf", title:L("Set the adjustable shelves","Coloca las repisas ajustables","Posez les étagères réglables"),
   text:L("Push 4 support pins into the side holes at your chosen heights — all four at the same level — and rest each adjustable shelf on top. Give it a firm downward press.","Mete 4 soportes en los agujeros laterales a la altura que elijas — los cuatro al mismo nivel — y apoya cada repisa ajustable encima. Presiona firmemente hacia abajo.","Enfoncez 4 taquets dans les trous latéraux aux hauteurs choisies — les quatre au même niveau — et posez chaque étagère réglable dessus. Pressez fermement vers le bas."),
   need:[[L("Adjustable shelf","Repisa ajustable","Étagère réglable"),"×2"],[L("Shelf support pin","Soporte de repisa","Taquet d'étagère"),"×8"]]},
  {svg:"tighten", title:L("Final check","Revisión final","Vérification finale"),
   text:L("Re-check every cam, load the heaviest books on the lowest shelf first, and confirm the strap is taut. The case should not lean or creak when you push its top corner.","Revisa cada excéntrica, carga los libros más pesados primero en la repisa más baja y confirma que la correa esté tensa. La estructura no debe inclinarse ni crujir al empujar su esquina superior.","Revérifiez chaque excentrique, chargez les livres les plus lourds d'abord sur l'étagère la plus basse et confirmez que la sangle est tendue. La structure ne doit ni pencher ni craquer quand on pousse son coin supérieur."),
   need:[[L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")}
 ]},
/* ---------- 6 · IKEA LACK side table ---------- */
{ id:"lack200", store:"IKEA", sku:"20011413", anchor:false,
 name:L("LACK Side Table","Mesa auxiliar LACK","Table d'appoint LACK"),
 blurb:L("The classic lightweight side table — four legs, one top, minutes to build.","La clásica mesa auxiliar ligera — cuatro patas, una cubierta, minutos para armarla.","La classique table d'appoint légère — quatre pieds, un plateau, quelques minutes."),
 time:L("~10 min","~10 min","~10 min"), diff:L("Very easy","Muy fácil","Très facile"),
 space:L("About 1 × 1 m of clear floor","Unos 1 × 1 m de piso libre","Environ 1 × 1 m de sol libre"), people:"1",
 parts:[[L("Tabletop","Cubierta","Plateau"),"×1"],[L("Leg","Pata","Pied"),"×4"]],
 hardware:[[L("Double-ended screw (pre-fitted in legs)","Tornillo doble (preinstalado en las patas)","Vis double (préinstallée dans les pieds)"),"×4"],[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]],
 tools:L("No tools needed — the legs twist in by hand.","Sin herramientas — las patas se enroscan a mano.","Aucun outil — les pieds se vissent à la main."),
 surface:L("The top is hollow-core: never sit or stand on this table, and keep heavy items centered.","La cubierta es hueca: nunca te sientes ni te pares en esta mesa, y mantén lo pesado centrado.","Le plateau est creux : ne vous asseyez ni ne montez jamais sur cette table, et centrez les objets lourds."),
 steps:[
  {svg:"unpack", title:L("Unpack the top and four legs","Desempaca la cubierta y las cuatro patas","Déballez le plateau et les quatre pieds"),
   text:L("Lay the tabletop face-down on a soft surface. Each leg already carries a double-ended screw — check none of them is bent.","Pon la cubierta boca abajo sobre una superficie suave. Cada pata ya trae un tornillo doble — revisa que ninguno esté doblado.","Posez le plateau face vers le bas sur une surface douce. Chaque pied porte déjà une vis double — vérifiez qu'aucune n'est tordue."),
   need:[[L("Tabletop","Cubierta","Plateau"),"×1"],[L("Leg","Pata","Pied"),"×4"]]},
  {svg:"screw", title:L("Check each leg's screw","Revisa el tornillo de cada pata","Vérifiez la vis de chaque pied"),
   text:L("Roll each leg in your fingers and look at its double-ended screw: half will hide inside the leg, half goes into the tabletop. If a screw wobbles in the leg, twist it snug first — a loose screw makes a wobbly table.","Rueda cada pata entre tus dedos y observa su tornillo doble: la mitad quedará dentro de la pata y la mitad entra en la cubierta. Si un tornillo se mueve dentro de la pata, enróscalo firme primero — un tornillo flojo hace una mesa tambaleante.","Faites rouler chaque pied entre vos doigts et regardez sa vis double : une moitié se cache dans le pied, l'autre entre dans le plateau. Si une vis bouge dans le pied, vissez-la d'abord — une vis lâche fait une table bancale."),
   need:[[L("Leg","Pata","Pied"),"×4"],[L("Double-ended screw (pre-fitted in legs)","Tornillo doble (preinstalado en las patas)","Vis double (préinstallée dans les pieds)"),"×4"]]},
  {svg:"legs", arg:"table", title:L("Twist in the first two legs","Enrosca las primeras dos patas","Vissez les deux premiers pieds"),
   text:L("Thread the first leg into a corner hole by hand, turning clockwise until it seats firmly against the underside. Repeat on the diagonal corner.","Enrosca la primera pata en un agujero de esquina a mano, girando en sentido horario hasta que asiente firme contra la parte inferior. Repite en la esquina diagonal.","Vissez le premier pied dans un trou de coin à la main, dans le sens horaire, jusqu'à ce qu'il soit ferme contre le dessous. Répétez au coin diagonal."),
   need:[[L("Leg","Pata","Pied"),"×2"]],
   tip:L("Start all four legs before fully seating any of them — a crooked start cross-threads easily.","Empieza las cuatro patas antes de asentar cualquiera por completo — un inicio torcido barre la rosca fácil.","Commencez les quatre pieds avant d'en serrer un à fond — un départ de travers abîme vite le filetage.")},
  {svg:"legs", arg:"table", title:L("Twist in the last two legs","Enrosca las últimas dos patas","Vissez les deux derniers pieds"),
   text:L("Fit the remaining two legs the same way. Each leg should end flush and firm — hand-tight is correct; do not use a wrench.","Coloca las dos patas restantes igual. Cada pata debe quedar a ras y firme — apretar a mano es lo correcto; no uses llave.","Posez les deux pieds restants de la même façon. Chaque pied doit finir affleurant et ferme — le serrage à la main suffit ; n'utilisez pas de clé."),
   need:[[L("Leg","Pata","Pied"),"×2"]]},
  {svg:"level", title:L("Flip it upright and check the feet","Voltéala y revisa las patas","Retournez-la et vérifiez les pieds"),
   text:L("Turn the table upright and press down on each corner in turn. All four feet should touch the floor at once with no rocking and no creaks.","Voltea la mesa y presiona cada esquina por turno. Las cuatro patas deben tocar el piso a la vez, sin tambaleo y sin crujidos.","Retournez la table et pressez chaque coin à tour de rôle. Les quatre pieds doivent toucher le sol en même temps, sans vaciller ni craquer."),
   need:[[L("Assembled table","Mesa armada","Table assemblée"),"×1"]],
   tip:L("If one foot hovers, swap that leg with a diagonal one — small length differences even out.","Si una pata queda en el aire, cámbiala por una diagonal — las pequeñas diferencias de largo se compensan.","Si un pied flotte, échangez-le avec celui en diagonale — les petites différences de longueur s'équilibrent.")},
  {svg:"tighten", title:L("Pad the feet — final check","Pon los fieltros — revisión final","Posez les patins — vérification finale"),
   text:L("Stick a felt pad under each leg, slide the table into place, and set something light on top. Done — this one really is that quick.","Pega un fieltro bajo cada pata, desliza la mesa a su lugar y pon algo ligero encima. Listo — esta sí es así de rápida.","Collez un patin sous chaque pied, glissez la table en place et posez quelque chose de léger dessus. Terminé — celle-ci est vraiment aussi rapide."),
   need:[[L("Felt pad","Fieltro protector","Patin en feutre"),"×4"]]}
 ]},

{ id:"malm3045", store:"IKEA", sku:"MALM3045", anchor:true,

 blurb:L("Wide three-drawer chest — must be wall-anchored before use.","Cómoda ancha de tres cajones — debe anclarse a la pared antes de usarla.","Commode large à trois tiroirs — à ancrer au mur avant usage."),
 time:L("~60 min","~60 min","~60 min"), diff:L("Hard","Difícil","Difficile"),

 tools:L("Phillips screwdriver, hammer, and a drill for the wall anchor.","Destornillador Phillips, martillo y un taladro para el anclaje a la pared.","Tournevis Phillips, marteau et une perceuse pour l'ancrage mural."),

 steps:[
  {svg:"sort", title:L("Sort case and drawer parts separately","Separa piezas de estructura y de cajones","Séparez pièces de structure et de tiroirs"),
   text:L("Make two zones: case parts (sides, top, rails, back) on the left, drawer parts (3 identical sets) on the right. Mixing them up is the number-one cause of a stalled build.","Haz dos zonas: piezas de la estructura (laterales, superior, rieles, trasero) a la izquierda, piezas de cajones (3 juegos idénticos) a la derecha. Mezclarlas es la causa número uno de un armado detenido.","Faites deux zones : pièces de structure (côtés, dessus, rails, dos) à gauche, pièces de tiroirs (3 jeux identiques) à droite. Les mélanger est la première cause de montage bloqué."),
   need:[[L("All parts","Todas las piezas","Toutes les pièces"),"×1"]],
   tip:L("Build one drawer completely first and use it as the template for the other two.","Arma un cajón completo primero y úsalo como plantilla para los otros dos.","Assemblez un tiroir en entier d'abord et servez-vous-en comme modèle pour les deux autres.")},
  {svg:"panels", title:L("Fit dowels and cam studs to the sides","Pon tarugos y pernos en los laterales","Chevilles et goujons sur les côtés"),
   text:L("Push the wooden dowels into the inner faces of both side panels and hand-screw the cam studs where the top and rails will land.","Mete los tarugos en las caras internas de ambos paneles laterales y enrosca a mano los pernos de excéntrica donde irán la parte superior y los rieles.","Enfoncez les chevilles dans les faces internes des deux panneaux latéraux et vissez à la main les goujons d'excentrique là où iront le dessus et les rails."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×2"],[L("Wooden dowel","Tarugo de madera","Cheville en bois"),"×14"],[L("Cam lock + stud","Excéntrica + perno","Excentrique + goujon"),"×10"]], tool:L("Your hands","Tus manos","Vos mains")},
  {svg:"frame", arg:1, title:L("Join the top, plinth and center rail","Une la parte superior, el zócalo y el riel central","Assemblez dessus, plinthe et rail central"),
   text:L("Lay one side panel flat. Seat the top panel, both plinth rails and the center support rail onto its dowels and studs, then lock each cam half a turn.","Pon un panel lateral acostado. Asienta el panel superior, ambos rieles de zócalo y el riel central sobre sus tarugos y pernos, y bloquea cada excéntrica media vuelta.","Posez un panneau latéral à plat. Placez le panneau supérieur, les deux rails de plinthe et le rail de support central sur ses chevilles et goujons, puis bloquez chaque excentrique d'un demi-tour."),
   need:[[L("Top panel","Panel superior","Panneau supérieur"),"×1"],[L("Bottom plinth rail","Riel de zócalo","Rail de plinthe"),"×2"],[L("Center support rail","Riel de soporte central","Rail de support central"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"glides", title:L("Screw on the drawer runners","Atornilla las correderas de los cajones","Vissez les coulisses des tiroirs"),
   text:L("Fix the case half of each runner set to both side panels at the three drawer heights, 4 screws per runner. Runners must be level pairs — a sloped runner binds the drawer.","Fija la mitad de estructura de cada corredera en ambos paneles laterales a las tres alturas de cajón, 4 tornillos por corredera. Deben quedar en pares nivelados — una corredera inclinada atora el cajón.","Fixez la moitié structure de chaque coulisse sur les deux panneaux latéraux aux trois hauteurs de tiroir, 4 vis par coulisse. Elles doivent être par paires de niveau — une coulisse inclinée bloque le tiroir."),
   need:[[L("Drawer runner set","Juego de correderas de cajón","Jeu de coulisses"),"×3"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"cams", title:L("Close the case with the second side","Cierra la estructura con el segundo lateral","Fermez la structure avec le second côté"),
   text:L("Lower the second side panel over the rails, align every stud, and lock all cams. Check the case is square before moving on.","Baja el segundo panel lateral sobre los rieles, alinea cada perno y bloquea todas las excéntricas. Revisa que la estructura esté a escuadra antes de seguir.","Abaissez le second panneau latéral sur les rails, alignez chaque goujon et bloquez tous les excentriques. Vérifiez que la structure est d'équerre avant de continuer."),
   need:[[L("Side panel","Panel lateral","Panneau latéral"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},
  {svg:"back", title:L("Attach the back panel","Fija el panel trasero","Fixez le panneau arrière"),
   text:L("Lay the back panel over the rear of the case and fix it with the small screws around the edge. The back keeps the whole chest from racking.","Pon el panel trasero sobre la parte de atrás de la estructura y fíjalo con los tornillos pequeños por todo el borde. El panel evita que toda la cómoda se ladée.","Posez le panneau arrière sur le dos de la structure et fixez-le avec les petites vis tout autour du bord. Le panneau empêche toute la commode de se voiler."),
   need:[[L("Back panel","Panel trasero","Panneau arrière"),"×1"],[L("Screw pack (assorted)","Bolsa de tornillos (surtida)","Sachet de vis (assorti)"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")},

  {svg:"drawer", arg:1, title:L("Slide the drawers in","Mete los cajones","Glissez les tiroirs"),
   text:L("Stand the chest upright with your partner. Slide each drawer onto its runners until both sides engage — each drawer should roll smoothly and its front should sit flush.","Pon la cómoda de pie con tu compañero. Desliza cada cajón sobre sus correderas hasta que ambos lados enganchen — cada cajón debe rodar suave y su frente debe quedar a ras.","Relevez la commode à deux. Glissez chaque tiroir sur ses coulisses jusqu'à l'engagement des deux côtés — chaque tiroir doit rouler doucement et sa façade affleurer."),
   need:[[L("Assembled drawers","Cajones armados","Tiroirs assemblés"),"×3"]],
   tip:L("If a drawer front sits crooked, swap it with another drawer before adjusting anything — fronts vary slightly.","Si un frente queda torcido, cámbialo por otro cajón antes de ajustar nada — los frentes varían ligeramente.","Si une façade est de travers, échangez-la avec un autre tiroir avant tout réglage — les façades varient légèrement.")},
  {svg:"anchor", title:L("Anchor the chest to the wall","Ancla la cómoda a la pared","Ancrez la commode au mur"),
   text:L("Move the chest into place and fix the anchor kit: bracket to the top rear of the chest, strap or screw into a wall stud. A loaded chest with open drawers can tip — anchoring is not optional.","Mueve la cómoda a su lugar y coloca el kit de anclaje: la escuadra en la parte trasera superior de la cómoda y la correa o tornillo a un montante de la pared. Una cómoda cargada con cajones abiertos puede volcarse — el anclaje no es opcional.","Mettez la commode en place et posez le kit d'ancrage : équerre en haut à l'arrière de la commode, sangle ou vis dans un montant du mur. Une commode chargée aux tiroirs ouverts peut basculer — l'ancrage n'est pas optionnel."),
   need:[[L("Wall anchor kit","Kit de anclaje a pared","Kit d'ancrage mural"),"×1"]], tool:L("Drill + screwdriver","Taladro + destornillador","Perceuse + tournevis")},
  {svg:"tighten", title:L("Final check","Revisión final","Vérification finale"),
   text:L("Re-tighten all cams, run every drawer in and out twice, and confirm the anchor is taut. Load heavier items into the lowest drawer first.","Vuelve a apretar todas las excéntricas, mete y saca cada cajón dos veces y confirma que el anclaje esté tenso. Carga lo más pesado primero en el cajón más bajo.","Resserrez tous les excentriques, faites coulisser chaque tiroir deux fois et confirmez que l'ancrage est tendu. Chargez les objets les plus lourds d'abord dans le tiroir du bas."),
   need:[[L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips"),"×1"]], tool:L("Phillips screwdriver","Destornillador Phillips","Tournevis Phillips")}
 ]},

 name:L("Furinno Turn-N-Tube 5-Tier Shelf","Estantería Furinno Turn-N-Tube de 5 niveles","Étagère Furinno Turn-N-Tube 5 niveaux"),

   text:L("Set the second panel on the base, twist 4 long tubes up through its corners until snug, then set the third panel on top of those tubes.","Coloca el segundo panel sobre la base, enrosca 4 tubos largos hacia arriba por sus esquinas hasta que queden firmes y luego coloca el tercer panel sobre esos tubos.","Posez le deuxième panneau sur la base, vissez 4 tubes longs vers le haut à travers ses coins jusqu'à ce qu'ils soient fermes, puis posez le troisième panneau sur ces tubes."),

   tip:L("Twist each tube a quarter turn past snug as you go — loose tubes are why these shelves lean.","Gira cada tubo un cuarto de vuelta más allá de lo firme al avanzar — los tubos flojos son la razón de que estas estanterías se inclinen.","Vissez chaque tube d'un quart de tour au-delà du serrage au fur et à mesure — ce sont les tubes lâches qui font pencher ces étagères.")},
  {svg:"pole", title:L("Add the fourth tier","Agrega el cuarto nivel","Ajoutez le quatrième niveau"),
   text:L("Twist the last 4 long tubes up through the third panel's corners and set the fourth panel on top. Sight down one side — the tubes should form one straight line from base to top.","Enrosca los últimos 4 tubos largos hacia arriba por las esquinas del tercer panel y coloca el cuarto panel encima. Mira desde un lado — los tubos deben formar una línea recta de la base a la parte superior.","Vissez les 4 derniers tubes longs vers le haut à travers les coins du troisième panneau et posez le quatrième panneau dessus. Regardez d'un côté — les tubes doivent former une ligne droite de la base au sommet."),
   need:[[L("Shelf panel","Panel de repisa","Panneau d'étagère"),"×1"],[L("Long tube","Tubo largo","Tube long"),"×4"]]},
  {svg:"pole", title:L("Cap the top tier","Remata el nivel superior","Finissez le niveau supérieur"),
   text:L("Place the fifth panel on top and press a cap into each corner hole. The caps lock the stack and finish the look.","Coloca el quinto panel arriba y presiona una tapa en cada agujero de esquina. Las tapas bloquean la pila y dan el acabado.","Posez le cinquième panneau en haut et pressez un embout dans chaque trou de coin. Les embouts bloquent l'empilement et finissent l'ensemble."),
   need:[[L("Shelf panel","Panel de repisa","Panneau d'étagère"),"×1"],[L("Cap / foot","Tapa / pie","Embout / pied"),"×4"]]},
  {svg:"level", title:L("Feet and final check","Pies y revisión final","Pieds et vérification finale"),
   text:L("Press the remaining caps into the bottom of the leg tubes as feet. Stand back and check the tower from two sides — give every tube one last quarter-turn if anything rocks.","Presiona las tapas restantes en la parte inferior de los tubos de pata como pies. Aléjate y revisa la torre desde dos lados — dale a cada tubo un último cuarto de vuelta si algo se mueve.","Pressez les embouts restants sous les tubes de pieds comme patins. Reculez et vérifiez la tour de deux côtés — donnez à chaque tube un dernier quart de tour si quelque chose bouge."),
   need:[[L("Cap / foot","Tapa / pie","Embout / pied"),"×4"]]}

 steps:[
  {svg:"sort", title:L("Sort shelves by depth","Ordena las repisas por profundidad","Triez les étagères par profondeur"),
   text:L("Line the four shelf boards up: deepest at the bottom of the ladder, then the two mediums, shallowest on top. Mixing up the order is the classic mistake with this shelf.","Alinea las cuatro tablas de repisa: la más profunda abajo de la escalera, luego las dos medianas y la más angosta arriba. Confundir el orden es el error clásico con esta estantería.","Alignez les quatre planches : la plus profonde en bas de l'échelle, puis les deux moyennes, la plus étroite en haut. Inverser l'ordre est l'erreur classique avec cette étagère."),
   need:[[L("Shelf boards (all depths)","Tablas de repisa (todas las profundidades)","Planches d'étagère (toutes profondeurs)"),"×4"]],
   tip:L("Label the boards 1 to 4 with painter's tape now and assembly becomes foolproof.","Etiqueta las tablas del 1 al 4 con cinta de pintor ahora y el armado se vuelve a prueba de errores.","Étiquetez les planches de 1 à 4 avec du ruban de masquage et le montage devient infaillible.")},
  {svg:"frame", arg:0, title:L("Raise shelves on the left frame","Levanta las repisas en la estructura izquierda","Montez les étagères sur le cadre gauche"),
   text:L("Lay the left ladder frame flat and rest each shelf board on its rungs, deepest at the bottom. Start one bolt per shelf corner — do not tighten yet.","Pon la estructura izquierda acostada y apoya cada tabla en sus peldaños, la más profunda abajo. Empieza un perno por esquina de repisa — no aprietes todavía.","Posez le cadre gauche à plat et posez chaque planche sur ses barreaux, la plus profonde en bas. Commencez un boulon par coin d'étagère — ne serrez pas encore."),
   need:[[L("Left ladder frame","Estructura izquierda de escalera","Cadre échelle gauche"),"×1"],[L("Hex bolt M6×30mm","Perno hex M6×30mm","Boulon hex M6×30mm"),"×4"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"frame", arg:3, title:L("Close with the right frame","Cierra con la estructura derecha","Fermez avec le cadre droit"),
   text:L("Lower the right ladder frame over the shelf ends, start the remaining bolts, and stand the unit up. Only now snug every bolt evenly, working top to bottom.","Baja la estructura derecha sobre los extremos de las repisas, empieza los pernos restantes y pon la unidad de pie. Recién ahora aprieta cada perno parejo, de arriba hacia abajo.","Abaissez le cadre droit sur les extrémités des étagères, commencez les boulons restants et relevez l'ensemble. Seulement maintenant, serrez chaque boulon uniformément, de haut en bas."),
   need:[[L("Right ladder frame","Estructura derecha de escalera","Cadre échelle droit"),"×1"],[L("Hex bolt M6×30mm","Perno hex M6×30mm","Boulon hex M6×30mm"),"×12"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"brace", title:L("Fit the rear X-brace","Coloca el refuerzo trasero en X","Posez le renfort arrière en X"),
   text:L("Cross the two brace bars in an X across the back of the frame and bolt all four ends. The X is what stops the ladder from swaying sideways.","Cruza las dos barras en forma de X por la parte trasera de la estructura y atornilla los cuatro extremos. La X es lo que evita que la escalera se tambalee hacia los lados.","Croisez les deux barres en X à l'arrière du cadre et boulonnez les quatre extrémités. Le X empêche l'échelle de vaciller sur les côtés."),
   need:[[L("X-brace bar","Barra de refuerzo en X","Barre de renfort en X"),"×2"]], tool:L("Allen wrench","Llave Allen","Clé Allen")},
  {svg:"anchor", title:L("Lean it and anchor to the wall","Apóyala y anclala a la pared","Appuyez-la et ancrez-la au mur"),
   text:L("Set the shelf against the wall so the top rests flat, then fix the anchor kit from the top rung into a stud or proper wall anchor. A leaning shelf is only stable once anchored.","Pon la estantería contra la pared para que la parte superior se apoye plana y fija el kit de anclaje desde el peldaño superior a un montante o taquete adecuado. Una estantería inclinada solo es estable cuando está anclada.","Placez l'étagère contre le mur pour que le haut repose à plat, puis fixez le kit d'ancrage du barreau supérieur dans un montant ou une cheville adaptée. Une étagère inclinée n'est stable qu'une fois ancrée."),
   need:[[L("Wall anchor kit","Kit de anclaje a pared","Kit d'ancrage mural"),"×1"]], tool:L("Drill + screwdriver","Taladro + destornillador","Perceuse + tournevis")},
  {svg:"tighten", title:L("Final check","Revisión final","Vérification finale"),
   text:L("Re-tighten every bolt, push the frame gently side to side — the X-brace should keep it rigid — and load heavier items on the deepest bottom shelf.","Vuelve a apretar cada perno, empuja la estructura suave hacia los lados — el refuerzo en X debe mantenerla rígida — y carga lo más pesado en la repisa inferior más profunda.","Resserrez chaque boulon, poussez doucement le cadre sur les côtés — le renfort en X doit le garder rigide — et chargez les objets lourds sur l'étagère inférieure la plus profonde."),
   need:[[L("Allen wrench","Llave Allen","Clé Allen"),"×1"]], tool:L("Allen wrench","Llave Allen","Clé Allen")}
 ]},

{ id:"abws518", store:"Amazon", sku:"ABWS518", anchor:false,
 name:L("Amazon Basics 5-Shelf Wire Storage Unit","Estantería de alambre Amazon Basics de 5 niveles","Étagère en fil Amazon Basics 5 niveaux"),
 blurb:L("Chrome wire shelving on four poles — each shelf height is adjustable.","Estantería de alambre cromado sobre cuatro postes — cada nivel es ajustable en altura.","Étagère en fil chromé sur quatre montants — chaque niveau est réglable en hauteur."),
 time:L("~25 min","~25 min","~25 min"), diff:L("Easy","Fácil","Facile"),
 space:L("About 1.5 × 1.5 m of clear floor","Unos 1.5 × 1.5 m de piso libre","Environ 1,5 × 1,5 m de sol libre"), people:"1",
 parts:[[L("Wire shelf","Repisa de alambre","Étagère en fil"),"×5"],[L("Pole section","Sección de poste","Section de montant"),"×8"],[L("Leveling foot","Pie nivelador","Pied réglable"),"×4"]],
 hardware:[[L("Plastic clip pair (sleeves)","Par de clips de plástico","Paire de clips plastiques"),"×20"],[L("Pole connector (pre-fitted)","Conector de poste (preinstalado)","Connecteur de montant (préinstallé)"),"×4"]],
 tools:L("No tools needed — a rubber mallet helps seat the shelves.","Sin herramientas — un mazo de goma ayuda a asentar las repisas.","Aucun outil — un maillet en caoutchouc aide à asseoir les étagères."),
 surface:L("Shelves lock onto plastic clips seated in pole grooves. If a shelf sits crooked, one clip pair is in the wrong groove — recount the grooves on all four poles.","Las repisas se bloquean sobre clips de plástico asentados en las ranuras de los postes. Si una repisa queda torcida, un par de clips está en la ranura equivocada — vuelve a contar las ranuras en los cuatro postes.","Les étagères se verrouillent sur des clips plastiques logés dans les rainures des montants. Si une étagère est de travers, une paire de clips est dans la mauvaise rainure — recomptez les rainures sur les quatre montants."),
 steps:[
  {svg:"sort", title:L("Sort poles, shelves and clips","Ordena postes, repisas y clips","Triez montants, étagères et clips"),
   text:L("Count 5 wire shelves, 8 pole sections (they join into 4 tall poles), 4 leveling feet and 20 clip pairs. The clips are small — keep them in the bag until each shelf goes on.","Cuenta 5 repisas de alambre, 8 secciones de poste (se unen en 4 postes altos), 4 pies niveladores y 20 pares de clips. Los clips son pequeños — déjalos en la bolsa hasta que pongas cada repisa.","Comptez 5 étagères en fil, 8 sections de montants (elles forment 4 grands montants), 4 pieds réglables et 20 paires de clips. Les clips sont petits — gardez-les dans le sachet jusqu'à la pose de chaque étagère."),
   need:[[L("Wire shelf","Repisa de alambre","Étagère en fil"),"×5"],[L("Pole section","Sección de poste","Section de montant"),"×8"],[L("Plastic clip pair (sleeves)","Par de clips de plástico","Paire de clips plastiques"),"×20"]],
   tip:L("Every pole groove is a possible shelf height — decide your shelf spacing before the first clip goes on.","Cada ranura del poste es una altura posible de repisa — decide el espaciado antes de poner el primer clip.","Chaque rainure de montant est une hauteur possible — décidez l'espacement avant le premier clip.")},
  {svg:"legs", arg:"frame", title:L("Join the poles and add feet","Une los postes y pon los pies","Assemblez les montants et ajoutez les pieds"),
   text:L("Screw the pole sections together into 4 full poles using the pre-fitted connectors, then twist a leveling foot into the bottom of each one.","Enrosca las secciones de poste en 4 postes completos con los conectores preinstalados y luego enrosca un pie nivelador en la base de cada uno.","Vissez les sections de montants en 4 montants complets avec les connecteurs préinstallés, puis vissez un pied réglable à la base de chacun."),
   need:[[L("Pole section","Sección de poste","Section de montant"),"×8"],[L("Leveling foot","Pie nivelador","Pied réglable"),"×4"]]},
  {svg:"wire", title:L("Clip on the bottom shelf","Engancha la repisa inferior","Clipsez l'étagère inférieure"),
   text:L("Snap a clip pair onto each pole at the same groove, low down. Slide the first shelf over the pole tops and press it down onto the clips until it locks. This shelf locks the whole frame square.","Engancha un par de clips en cada poste en la misma ranura, abajo. Desliza la primera repisa por encima de los postes y presiónala sobre los clips hasta que bloquee. Esta repisa escuadra toda la estructura.","Clipsez une paire de clips sur chaque montant dans la même rainure, en bas. Glissez la première étagère par-dessus les montants et pressez-la sur les clips jusqu'au verrouillage. Cette étagère met tout le cadre d'équerre."),
   need:[[L("Wire shelf","Repisa de alambre","Étagère en fil"),"×1"],[L("Plastic clip pair (sleeves)","Par de clips de plástico","Paire de clips plastiques"),"×4"]],
   tip:L("Count grooves out loud on all four poles — one pole off by a single groove tilts the shelf.","Cuenta las ranuras en voz alta en los cuatro postes — un poste desviado por una sola ranura inclina la repisa.","Comptez les rainures à voix haute sur les quatre montants — un montant décalé d'une rainure incline l'étagère.")},
  {svg:"wire", title:L("Add the middle shelves","Agrega las repisas del medio","Ajoutez les étagères du milieu"),
   text:L("Repeat the clip-and-press pattern for the next three shelves at your chosen heights. Work one shelf at a time and press each corner down firmly.","Repite el patrón de clips y presión para las tres repisas siguientes a las alturas que elegiste. Trabaja una repisa a la vez y presiona cada esquina con firmeza.","Répétez le motif clips et pression pour les trois étagères suivantes aux hauteurs choisies. Travaillez une étagère à la fois et pressez chaque coin fermement."),
   need:[[L("Wire shelf","Repisa de alambre","Étagère en fil"),"×3"],[L("Plastic clip pair (sleeves)","Par de clips de plástico","Paire de clips plastiques"),"×12"]]},
  {svg:"wire", title:L("Top shelf and seat everything","Repisa superior y asienta todo","Étagère supérieure et assise complète"),
   text:L("Clip on the fifth shelf at the top. Then press down firmly on every shelf corner, or tap with the mallet, so each shelf is fully seated on its clips.","Engancha la quinta repisa arriba. Luego presiona con firmeza cada esquina de cada repisa, o golpea con el mazo, para que cada una quede totalmente asentada en sus clips.","Clipsez la cinquième étagère en haut. Puis pressez fermement chaque coin de chaque étagère, ou tapez au maillet, pour que chacune soit bien assise sur ses clips."),
   need:[[L("Wire shelf","Repisa de alambre","Étagère en fil"),"×1"],[L("Plastic clip pair (sleeves)","Par de clips de plástico","Paire de clips plastiques"),"×4"]], tool:L("Rubber mallet (optional)","Mazo de goma (opcional)","Maillet en caoutchouc (optionnel)")},
  {svg:"level", title:L("Level the feet and load check","Nivela los pies y prueba de carga","Réglez les pieds et test de charge"),
   text:L("Twist the leveling feet until the unit stands without rocking. Load the heaviest items on the lowest shelf and spread weight toward the poles, not the shelf centers.","Gira los pies niveladores hasta que la unidad quede sin tambalearse. Carga lo más pesado en la repisa más baja y reparte el peso hacia los postes, no hacia el centro de las repisas.","Tournez les pieds réglables jusqu'à ce que l'ensemble ne vacille plus. Chargez les objets les plus lourds sur l'étagère la plus basse et répartissez le poids vers les montants, pas vers le centre des étagères."),
   need:[[L("Leveling foot","Pie nivelador","Pied réglable"),"×4"]],
   tip:L("Wire shelves flex by design — a slight bounce under load is normal, a tilt is not.","Las repisas de alambre se flexionan por diseño — un leve rebote bajo carga es normal, una inclinación no.","Les étagères en fil fléchissent par conception — un léger rebond sous charge est normal, une inclinaison non.")}
 ]},

 tools:L("Phillips screwdriver and a hammer. A second person helps when flipping the desk upright.","Destornillador Phillips y martillo. Una segunda persona ayuda al voltear el escritorio.","Tournevis Phillips et marteau. Une deuxième personne aide pour redresser le bureau."),
